<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radar UI</title>
<style>
  html, body { margin: 0; background: #0b140b; height: 100%; }
  canvas { display: block; margin: auto; background: radial-gradient(circle at 50% 70%, #0f2a12, #081008 100%); }
  .permission-notice {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0, 20, 0, 0.9); color: #6dff6d; padding: 30px;
    border: 2px solid #6dff6d; border-radius: 10px; font-family: monospace;
    text-align: center; z-index: 100; width: 80%; max-width: 500px;
    box-shadow: 0 0 30px rgba(109, 255, 109, 0.5);
  }
  .enable-button {
    background: #0b140b; border: 2px solid #6dff6d; color: #6dff6d;
    padding: 15px 30px; border-radius: 5px; cursor: pointer;
    font-family: monospace; font-size: 18px; margin-top: 20px; transition: all 0.3s;
  }
  .enable-button:hover { background: #6dff6d; color: #0b140b; box-shadow: 0 0 20px rgba(109, 255, 109, 0.8); }
  #blackOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000000; z-index: 99; display: flex; justify-content: center; align-items: center;
  }
  .countdown { font-size: 24px; color: #32ff32; margin-top: 20px; font-weight: bold; min-height: 30px; }
</style>
</head>
<body>

<div id="blackOverlay">
  <div class="permission-notice">
    <h3>⚠️ ALIEN TRACKER INITIALIZATION ⚠️</h3>
    <p>This device requires compass access to activate the geo-locked radar system.</p>
    <p>Ensure you are in a secure location before proceeding.</p>
    <p style="color: #32ff32; font-weight: bold;">HTTPS connection established</p>
    <button class="enable-button" id="enableButton">ENABLE COMPASS TRACKING</button>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<canvas id="radar"></canvas>

<audio id="backgroundAudio" loop preload="auto">
  <source src="https://github.com/epicrezdomain-design/AlienTracker/raw/main/TrackerAmbient.mp3" type="audio/mp3">
</audio>

<script>

const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");
const blackOverlay = document.getElementById("blackOverlay");
const enableButton = document.getElementById("enableButton");
const countdownElement = document.getElementById("countdown");
const backgroundAudio = document.getElementById('backgroundAudio');

canvas.width = 1280;
canvas.height = 720;

const greenDots = [];
let compassDirection = 0;

// ============================================================
// VERSION
// ============================================================
const VERSION = "V.03";

// ============================================================
// TIMELINE (all relative to dotAppearTime, in ms)
// ============================================================
// 0           -> appear at 0.95
// 3000        -> jump to 0.75
// 5000        -> jump to 0.55
// 6500        -> jump to 0.35
// 7500        -> jump to 0.15
// 7500-10500  -> recede back out (0.15 -> 0.95)
// 10500-13500 -> FADE OUT (1 -> 0)
// 13500-17500 -> invisible pause
// 17500       -> cycle ends; next dot scheduled 10s after that
// ============================================================
const STEP_TIMES = [0, 3000, 5000, 6500, 7500];
const STEP_DISTANCES = [0.95, 0.75, 0.55, 0.35, 0.15];
const RECEDE_START = 7500;
const RECEDE_END   = 10500;
const FADE_START   = 10500;
const FADE_END     = 13500;
const CYCLE_END    = 17500;

let dotAppearTime = 0;
let nextAppearTime = 0;
let geoFrozenDirection = 0;

// ============================================================
// PURE FUNCTION: compute dot state from "now" alone
// ============================================================
function computeGeoDot(now) {
  // First appearance / cycle scheduling
  if (dotAppearTime === 0) {
    dotAppearTime = now;
    nextAppearTime = dotAppearTime + CYCLE_END + 10000;
    geoFrozenDirection = compassDirection;
  } else if (now >= nextAppearTime) {
    // Start a fresh cycle
    dotAppearTime = now;
    nextAppearTime = dotAppearTime + CYCLE_END + 10000;
    geoFrozenDirection = compassDirection;
  }

  const t = now - dotAppearTime;

  // Outside the active cycle -> invisible
  if (t < 0 || t >= CYCLE_END) {
    return { visible: false, opacity: 0, distance: STEP_DISTANCES[0] };
  }

  // Distance
  let distance;
  if (t < RECEDE_START) {
    let stepIdx = 0;
    for (let i = STEP_TIMES.length - 1; i >= 0; i--) {
      if (t >= STEP_TIMES[i]) { stepIdx = i; break; }
    }
    distance = STEP_DISTANCES[stepIdx];
  } else if (t < RECEDE_END) {
    const rt = (t - RECEDE_START) / (RECEDE_END - RECEDE_START);
    const eased = rt < 0.5 ? 2*rt*rt : 1 - Math.pow(-2*rt+2, 2)/2;
    distance = STEP_DISTANCES[STEP_DISTANCES.length-1]
             + (STEP_DISTANCES[0] - STEP_DISTANCES[STEP_DISTANCES.length-1]) * eased;
  } else {
    distance = STEP_DISTANCES[0];
  }

  // Opacity
  let opacity;
  if (t < FADE_START) {
    opacity = 1;
  } else if (t < FADE_END) {
    opacity = 1 - (t - FADE_START) / (FADE_END - FADE_START);
  } else {
    opacity = 0;
  }

  return { visible: opacity > 0.003, opacity, distance };
}

// ============================================================
// State
// ============================================================
let borderHighlights = { left: false, right: false, bottom: false, intensity: 0 };
let deviceOrientation = { available: false, alpha: 0, beta: 0, gamma: 0 };

let isRolling = false, rollOffset = 0, rollSpeed = 30, rollCount = 0, maxRolls = 5, lastRollTime = 0;
let lastWarpTime = 0, warpActive = false, warpProgress = 0, warpX = 0, warpY = 0, warpStrength = 0, warpDuration = 0, warpsThisCycle = 0, warpsDone = 0;

const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.width;
tempCanvas.height = canvas.height;
const tempCtx = tempCanvas.getContext('2d');

// Click handler
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  greenDots.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, life: 100 });
});

// Audio
function playBackgroundAudio() {
  backgroundAudio.volume = 0.4;
  const p = backgroundAudio.play();
  if (p) p.catch(() => {
    const na = new Audio(backgroundAudio.src);
    na.volume = 0.4; na.loop = true;
    na.play().catch(()=>{});
  });
}

// Countdown
function startCountdown(duration, callback) {
  let timeLeft = duration;
  countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
  const ci = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(ci);
      countdownElement.textContent = "SYSTEM ONLINE";
      setTimeout(callback, 300);
    } else {
      countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
    }
  }, 100);
}

function startRadarSystem() {
  blackOverlay.style.display = 'none';
  dotAppearTime = 0;
  nextAppearTime = 0;
  drawEverything();
}

// Orientation
function initDeviceOrientation() {
  backgroundAudio.volume = 0.4;
  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        DeviceOrientationEvent.requestPermission().then(ps => {
          if (ps === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation);
            enableButton.disabled = true;
            enableButton.textContent = "INITIALIZING...";
            startCountdown(.8, startRadarSystem);
          }
        }).catch(console.error);
      });
    } else {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        window.addEventListener('deviceorientation', handleOrientation);
        enableButton.disabled = true;
        enableButton.textContent = "INITIALIZING...";
        startCountdown(.8, startRadarSystem);
      });
    }
  } else {
    enableButton.addEventListener('click', () => {
      playBackgroundAudio();
      setupMouseOrientation();
      enableButton.disabled = true;
      enableButton.textContent = "INITIALIZING...";
      startCountdown(.8, startRadarSystem);
    });
  }
}

function handleOrientation(e) {
  if (e.alpha !== null) {
    compassDirection = e.alpha;
    updateBorderHighlights();
  }
}

function setupMouseOrientation() {
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const dx = mx - canvas.width/2, dy = my - canvas.height*0.72;
    let a = Math.atan2(dy, dx) * 180 / Math.PI;
    a = (a + 90) % 360; if (a < 0) a += 360;
    compassDirection = a;
    updateBorderHighlights();
  });
}

function updateBorderHighlights() {
  const d = compassDirection;
  const inR = (d >= 315 || d <= 45);
  borderHighlights.left = borderHighlights.right = borderHighlights.bottom = false;
  if (!inR) {
    if ((d > 45 && d <= 135) || (d >= 225 && d < 315)) {
      if (d >= 225 && d < 315) borderHighlights.left = true;
      else borderHighlights.right = true;
    } else borderHighlights.bottom = true;
    borderHighlights.intensity = Math.min(1, borderHighlights.intensity + 0.1);
  } else {
    borderHighlights.intensity = Math.max(0, borderHighlights.intensity - 0.05);
  }
}

function isInRadarCone(d) { return (d >= 315 || d <= 45); }

// Draw loop
function drawEverything() {
  const now = Date.now();
  if (!lastRollTime) lastRollTime = now + 5000;
  if (!isRolling && (now - lastRollTime > 300000)) {
    isRolling = true; rollOffset = 0; rollCount = 0; rollSpeed = 30;
  }
  drawRadarUI();
  requestAnimationFrame(drawEverything);
}

function drawRadarUI() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const now = Date.now();

  const dot = computeGeoDot(now);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,2)';
  for (let y = 0; y < canvas.height; y += 5) ctx.fillRect(0, y, canvas.width, .8);

  // Static
  const pulse = Math.sin(now/1000 * 2) * 0.5 + 0.5;
  if (pulse > 0.3) {
    const n = Math.floor(30 * pulse);
    for (let i = 0; i < n; i++) {
      ctx.fillStyle = `rgba(120, 255, 120, ${Math.random() * 0.3 * pulse})`;
      ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, Math.random()*3+1, Math.random()*3+1);
    }
  }

  // Vertical jitter (skip during fade)
  if (now - dotAppearTime < FADE_START && Math.random() > 0.97) {
    const j = Math.random() * 4 - 2;
    ctx.putImageData(ctx.getImageData(0, 0, canvas.width, canvas.height), 0, j);
  }

  // Circle segments
  const circleX = canvas.width/2, circleY = canvas.height*0.71, circleRadius = 110, lineWidth = 45;
  [[232,315],[45,130],[137,225]].forEach(([s,e], i) => {
    const sr = ((s-90)*Math.PI/180), er = ((e-90)*Math.PI/180);
    let hl = false, hi = 0;
    if (i===0 && borderHighlights.left) { hl = true; hi = borderHighlights.intensity; }
    else if (i===1 && borderHighlights.right) { hl = true; hi = borderHighlights.intensity; }
    else if (i===2 && borderHighlights.bottom) { hl = true; hi = borderHighlights.intensity; }
    if (hl && hi > 0) {
      const r = Math.round(109 + (50-109)*hi), g = 255, b = Math.round(109 + (50-109)*hi);
      ctx.lineWidth = lineWidth + 10*hi;
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.3 + 0.7*hi})`;
      ctx.shadowBlur = 20*hi; ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${0.7*hi})`;
    } else {
      ctx.lineWidth = lineWidth; ctx.strokeStyle = "rgba(109, 255, 109, 0.3)"; ctx.shadowBlur = 0;
    }
    ctx.lineCap = 'butt';
    if (e < s) {
      ctx.beginPath(); ctx.arc(circleX, circleY, circleRadius, sr, Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(circleX, circleY, circleRadius, 0, er); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(circleX, circleY, circleRadius, sr, er); ctx.stroke();
    }
    ctx.shadowBlur = 0;
  });

  // Radar arcs
  const cx = canvas.width/2, apexY = canvas.height*0.72, radius = canvas.height*0.62;
  const startAngle = -Math.PI*0.73, endAngle = -Math.PI*0.27;
  const green = "#6dff6d";
  const polar = (r, a) => ({ x: cx + r*Math.cos(a), y: apexY + r*Math.sin(a) });

  ctx.strokeStyle = green; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(cx, apexY, radius, startAngle+0.015, endAngle-0.015); ctx.stroke();

  ctx.strokeStyle = green; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, apexY, radius-10, startAngle+0.015, endAngle-0.015); ctx.stroke();

  ctx.lineWidth = 3;
  [startAngle, endAngle].forEach(a => {
    const p = polar(radius, a);
    ctx.beginPath(); ctx.moveTo(cx, apexY); ctx.lineTo(p.x, p.y); ctx.stroke();
  });

  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, apexY); ctx.lineTo(cx, apexY - radius*1.03); ctx.stroke();

  [-0.48, +0.48].forEach(t => {
    const a = startAngle + (endAngle - startAngle) * (t + 1) / 2;
    const p = polar(radius*1.03, a);
    ctx.beginPath(); ctx.moveTo(cx, apexY); ctx.lineTo(p.x, p.y); ctx.stroke();
  });

  ctx.setLineDash([15, 30]); ctx.lineWidth = 1.5;
  [0.35, 0.55, 0.75].forEach(r => {
    ctx.beginPath(); ctx.arc(cx, apexY, radius*r, startAngle+0.03, endAngle-0.03); ctx.stroke();
  });
  ctx.setLineDash([]);

  // Click dots
  for (let i = greenDots.length - 1; i >= 0; i--) {
    const d = greenDots[i];
    d.life -= 1.5;
    if (d.life > 0) {
      ctx.fillStyle = `rgba(109, 255, 109, ${d.life/100})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, 6, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = `rgba(109, 255, 109, ${d.life/200})`;
      ctx.beginPath(); ctx.arc(d.x, d.y, 10, 0, Math.PI*2); ctx.fill();
    } else greenDots.splice(i, 1);
  }

  // Left buttons
  ctx.fillStyle = "#32ff32";
  ctx.fillRect(cx - radius*0.65, apexY + 20, 70, 40);
  ctx.fillRect(cx - radius*0.65, apexY + 80, 48, 40);

  ctx.fillStyle = "#0b140b"; ctx.font = "28px monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("1", cx - radius*0.63 + 50, apexY + 44);
  ctx.fillText("2", cx - radius*0.63 + 24, apexY + 104);

  // Version label under the "2" button
  ctx.fillStyle = "rgba(109, 255, 109, 0.75)";
  ctx.font = "14px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText(VERSION, cx - radius*0.63, apexY + 140);

  // Right labels
  ctx.fillStyle = green; ctx.font = "Bold 26px monospace"; ctx.textAlign = "left";
  ["ATT","SUS","DEC"].forEach((t, i) => ctx.fillText(t, cx + radius*0.55, apexY + 35 + i*36));

  // ===== GEO DOT (pure-math driven) =====
  if (dot.visible && isInRadarCone(geoFrozenDirection)) {
    const dotR = 8;
    const r = radius * dot.distance;
    const a = (geoFrozenDirection - 90) * (Math.PI/180);
    const dx = cx + Math.cos(a) * r;
    const dy = apexY + Math.sin(a) * r;

    ctx.fillStyle = `rgba(50, 255, 50, ${dot.opacity})`;
    ctx.beginPath(); ctx.arc(dx, dy, dotR, 0, Math.PI*2); ctx.fill();

    const lx = dx + Math.cos(a) * 20, ly = dy + Math.sin(a) * 20;
    ctx.strokeStyle = `rgba(50, 255, 50, ${dot.opacity})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(lx, ly); ctx.stroke();
  }

  // ===== WARP EFFECT =====
  if (!lastWarpTime) { lastWarpTime = now; warpsThisCycle = Math.floor(Math.random()*4)+1; }
  if (!warpActive && warpsDone < warpsThisCycle && (now - lastWarpTime > 300000)) {
    warpActive = true; warpProgress = 0;
    warpX = Math.random()*canvas.width; warpY = Math.random()*canvas.height;
    warpStrength = Math.random()*80 + 40; warpDuration = Math.random()*60 + 40;
  }
  if (warpActive) {
    warpProgress++;
    let intensity = 0;
    if (warpProgress < warpDuration*0.3) intensity = warpProgress/(warpDuration*0.3);
    else if (warpProgress < warpDuration*0.7) intensity = 1;
    else intensity = 1 - ((warpProgress - warpDuration*0.7)/(warpDuration*0.3));
    const cs = warpStrength * intensity;
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = img.data;
    const tmp = ctx.createImageData(canvas.width, canvas.height);
    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const ddx = x - warpX, ddy = y - warpY;
        const dist = Math.sqrt(ddx*ddx + ddy*ddy);
        const wa = cs / (dist + 10);
        const sx = Math.max(0, Math.min(canvas.width-1, x + ddx*wa*0.015));
        const sy = Math.max(0, Math.min(canvas.height-1, y + ddy*wa*0.015));
        const si = (Math.floor(sy)*canvas.width + Math.floor(sx))*4;
        const di = (y*canvas.width + x)*4;
        if (dist < 150) {
          const cd = 1 + (cs/300)*(1 - dist/150);
          tmp.data[di] = Math.min(255, data[si]*cd);
          tmp.data[di+1] = Math.min(255, data[si+1]*(cd*0.7));
          tmp.data[di+2] = Math.min(255, data[si+2]*(cd*1.3));
          tmp.data[di+3] = data[si+3];
        } else {
          tmp.data[di] = data[si]; tmp.data[di+1] = data[si+1];
          tmp.data[di+2] = data[si+2]; tmp.data[di+3] = data[si+3];
        }
      }
    }
    ctx.putImageData(tmp, 0, 0);
    ctx.fillStyle = `rgba(255, 50, 50, ${intensity*0.6})`;
    ctx.beginPath(); ctx.arc(warpX, warpY, 8 + intensity*25, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = `rgba(255, 100, 100, ${intensity*0.4})`;
    ctx.lineWidth = 1 + intensity;
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.arc(warpX, warpY, i*60 + intensity*40, 0, Math.PI*2); ctx.stroke();
    }
    if (warpProgress >= warpDuration) {
      warpActive = false; warpsDone++;
      if (warpsDone >= warpsThisCycle) {
        lastWarpTime = now; warpsDone = 0;
        warpsThisCycle = Math.floor(Math.random()*4)+1;
      }
    }
  }

  // ===== ROLL EFFECT =====
  if (isRolling) {
    tempCtx.clearRect(0, 0, canvas.width, canvas.height);
    tempCtx.drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    rollOffset += rollSpeed;
    if (rollOffset >= canvas.height) {
      rollOffset = 0; rollCount++;
      if (rollCount >= 4) rollSpeed *= 0.7;
      if (rollCount >= maxRolls || rollSpeed < 1) {
        isRolling = false; rollOffset = 0; rollCount = 0; rollSpeed = 30;
        lastRollTime = Date.now();
        ctx.drawImage(tempCanvas, 0, 0);
        return;
      }
    }
    ctx.drawImage(tempCanvas, 0, canvas.height - rollOffset, canvas.width, rollOffset, 0, 0, canvas.width, rollOffset);
    ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height - rollOffset, 0, rollOffset, canvas.width, canvas.height - rollOffset);
    ctx.strokeStyle = rollCount < 4 ? 'rgba(255, 50, 50, 0.6)' : 'rgba(120, 255, 120, 0.4)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const ly = (rollOffset + i*50) % canvas.height;
      ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(canvas.width, ly); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(0, rollOffset - 2, canvas.width, 4);
  }
}

initDeviceOrientation();

</script>
</body>
</html>
