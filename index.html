<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radar UI</title>
<style>
  html, body {
    margin: 0;
    background: #0b140b;
    height: 100%;
  }

  :root {
    --bloom-tight:  0.95;   /* soft skirt around bright lines */
    --bloom-wide:   0.65;   /* faint wide glow */
  }

  .crt {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: auto;
    overflow: hidden;
    isolation: isolate;
  }

  canvas#radar {
    display: block;
    background: radial-gradient(circle at 50% 70%, #0f2a12, #081008 100%);
    /* GAMMA BOOST: brighter + slightly punchier contrast */
    filter: brightness(2.5) contrast(1.18);
  }

  /* Bloom layers: blurred copies of the radar, layered over it with 'lighten' blend */
  .bloom, .label-layer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .bloom { mix-blend-mode: lighten; }
  .bloom-tight { filter: blur(9px);  opacity: var(--bloom-tight); }
  .bloom-wide  { filter: blur(24px) brightness(1.4); opacity: var(--bloom-wide); }

  /* Label layer sits ABOVE the bloom, so text + buttons are never blurred */
  .label-layer { z-index: 5; }

  .permission-notice {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 20, 0, 0.9);
    color: #6dff6d;
    padding: 30px;
    border: 2px solid #6dff6d;
    border-radius: 10px;
    font-family: monospace;
    text-align: center;
    z-index: 100;
    width: 80%;
    max-width: 500px;
    box-shadow: 0 0 30px rgba(109, 255, 109, 0.5);
  }

  .enable-button {
    background: #0b140b;
    border: 2px solid #6dff6d;
    color: #6dff6d;
    padding: 15px 30px;
    border-radius: 5px;
    cursor: pointer;
    font-family: monospace;
    font-size: 18px;
    margin-top: 20px;
    transition: all 0.3s;
  }

  .enable-button:hover {
    background: #6dff6d;
    color: #0b140b;
    box-shadow: 0 0 20px rgba(109, 255, 109, 0.8);
  }

  #blackOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 99;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .countdown {
    font-size: 24px;
    color: #32ff32;
    margin-top: 20px;
    font-weight: bold;
    min-height: 30px;
  }
</style>
</head>
<body>

<div id="blackOverlay">
  <div class="permission-notice" id="permissionNotice">
    <h3>⚠️ ALIEN TRACKER INITIALIZATION ⚠️</h3>
    <p>This device requires compass access to activate the geo-locked radar system.</p>
    <p>Ensure you are in a secure location before proceeding.</p>
    <p style="color: #32ff32; font-weight: bold;">HTTPS connection established</p>
    <button class="enable-button" id="enableButton">ENABLE COMPASS TRACKING</button>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<div class="crt">
  <canvas id="radar"></canvas>
  <canvas id="bloomTight" class="bloom bloom-tight" width="1280" height="720"></canvas>
  <canvas id="bloomWide"  class="bloom bloom-wide"  width="1280" height="720"></canvas>
  <canvas id="labelLayer" class="label-layer" width="1280" height="720"></canvas>
</div>

<audio id="backgroundAudio" loop preload="auto">
  <source src="https://github.com/epicrezdomain-design/AlienTracker/raw/main/TrackerAmbient.mp3" type="audio/mp3">
  Your browser does not support the audio element.
</audio>

<script>

const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");
const blackOverlay = document.getElementById("blackOverlay");
const enableButton = document.getElementById("enableButton");
const countdownElement = document.getElementById("countdown");
const backgroundAudio = document.getElementById('backgroundAudio');

const VERSION_LABEL = "V.12";

canvas.width = 1280;
canvas.height = 720;

// ===== BLOOM LAYERS =====
const bloomTightCanvas = document.getElementById('bloomTight');
const bloomWideCanvas  = document.getElementById('bloomWide');
const bloomTightCtx = bloomTightCanvas.getContext('2d');
const bloomWideCtx  = bloomWideCanvas.getContext('2d');

// Label layer: text + button blocks drawn here appear ON TOP of the bloom (no blur)
const labelLayerCanvas = document.getElementById('labelLayer');
const labelLayerCtx = labelLayerCanvas.getContext('2d');

const greenDots = [];

let compassDirection = 0;

// ===== GEO DOT STEPPED APPROACH =====
const APPROACH_DISTANCES = [0.95, 0.75, 0.55, 0.35];
const APPROACH_DELAYS_MS = [3000, 2000, 1500, 1000];
const CLOSEST_DISTANCE   = 0.15;
const LEAVE_DISTANCES    = [0.35, 0.55, 0.75, 0.95];
const LEAVE_DELAYS_MS    = [1500, 2000, 3000, 1500];

const DISTANCE_JITTER  = 0.06;
const MIN_DISTANCE_GAP = 0.08;
const DELAY_JITTER     = 0.25;
const MIN_DELAY_MS     = 1000;

const CLOSEST_BLEEPS          = 7;
const CLOSEST_BLEEPS_VARIANCE = 1;
const CLOSEST_DELAY_MIN_MS    = 1000;
const CLOSEST_DELAY_MAX_MS    = 1400;
const CLOSEST_WOBBLE          = 0.01;

const INITIAL_DELAY_MS = 10000;
const STEP_HOLD_MS     = 200;
const STEP_FADE_MS     = 700;
const CYCLE_PAUSE_MS   = 4000;

function rand(min, max) { return min + Math.random() * (max - min); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function jitterDelay(ms) {
  return Math.max(MIN_DELAY_MS, Math.round(ms * (1 + rand(-DELAY_JITTER, DELAY_JITTER))));
}

function jitterDistances(base, closer) {
  const out = base.map(d => clamp(d + rand(-DISTANCE_JITTER, DISTANCE_JITTER), 0.22, 0.98));
  out.sort((x, y) => closer ? y - x : x - y);
  for (let i = 1; i < out.length; i++) {
    out[i] = closer ? Math.min(out[i], out[i - 1] - MIN_DISTANCE_GAP)
                    : Math.max(out[i], out[i - 1] + MIN_DISTANCE_GAP);
  }
  return out.map(d => clamp(d, 0.22, 0.98));
}

function buildGeoSequence() {
  const seq = [];
  const inD = jitterDistances(APPROACH_DISTANCES, true);
  inD.forEach((d, i) => seq.push({ dist: d, delay: jitterDelay(APPROACH_DELAYS_MS[i]) }));

  const bleeps = CLOSEST_BLEEPS + Math.floor(rand(-CLOSEST_BLEEPS_VARIANCE, CLOSEST_BLEEPS_VARIANCE + 1));
  for (let i = 0; i < bleeps; i++) {
    seq.push({
      dist: CLOSEST_DISTANCE + rand(-CLOSEST_WOBBLE, CLOSEST_WOBBLE),
      delay: Math.round(rand(CLOSEST_DELAY_MIN_MS, CLOSEST_DELAY_MAX_MS))
    });
  }

  const outD = jitterDistances(LEAVE_DISTANCES, false);
  outD.forEach((d, i) => seq.push({ dist: d, delay: jitterDelay(LEAVE_DELAYS_MS[i]) }));

  return seq;
}

let geoSequence = buildGeoSequence();
let geoPhase = 'delay';
let geoPhaseStart = 0;
let geoFadeStart = 0;
let geoStepIndex = 0;
let geoStepStart = 0;
let geoDistance = geoSequence[0].dist;
let geoOpacity = 0;
let geoFrozenDirection = 0;

function startGeoCycle(now) {
  geoSequence = buildGeoSequence();
  geoPhase = 'delay';
  geoPhaseStart = now;
  geoStepIndex = 0;
  geoStepStart = 0;
  geoDistance = geoSequence[0].dist;
  geoOpacity = 0;
  geoFadeStart = 0;
}

function updateGeoDot(now) {
  if (geoPhase === 'delay') {
    geoOpacity = 0;
    if (now - geoPhaseStart >= INITIAL_DELAY_MS) {
      geoPhase = 'stepping';
      geoStepIndex = 0;
      geoStepStart = now;
      geoDistance = geoSequence[0].dist;
      geoOpacity = 1;
      geoFrozenDirection = compassDirection;
    }
  } else if (geoPhase === 'stepping') {
    const sinceStep = now - geoStepStart;
    if (sinceStep <= STEP_HOLD_MS) {
      geoOpacity = 1;
    } else {
      const ft = Math.min((sinceStep - STEP_HOLD_MS) / STEP_FADE_MS, 1);
      geoOpacity = 1 - ft;
    }

    if (sinceStep >= geoSequence[geoStepIndex].delay) {
      geoStepIndex++;
      geoStepStart = now;
      if (geoStepIndex < geoSequence.length) {
        geoDistance = geoSequence[geoStepIndex].dist;
        geoOpacity = 1;
      } else {
        geoPhase = 'pause';
        geoPhaseStart = now;
        geoOpacity = 0;
      }
    }
  } else if (geoPhase === 'pause') {
    geoOpacity = 0;
    if (now - geoPhaseStart >= CYCLE_PAUSE_MS) {
      startGeoCycle(now);
    }
  }
}

let borderHighlights = { left: false, right: false, bottom: false, intensity: 0 };
let deviceOrientation = { available: false, alpha: 0, beta: 0, gamma: 0 };

let isRolling = false, rollOffset = 0, rollSpeed = 30, rollCount = 0, maxRolls = 5, lastRollTime = 0;
let lastWarpTime = 0, warpActive = false, warpProgress = 0, warpX = 0, warpY = 0, warpStrength = 0, warpDuration = 0, warpsThisCycle = 0, warpsDone = 0;

const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.width;
tempCanvas.height = canvas.height;
const tempCtx = tempCanvas.getContext('2d');

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  greenDots.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, life: 100 });
});

function playBackgroundAudio() {
  backgroundAudio.volume = 0.4;
  const playPromise = backgroundAudio.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      const newAudio = new Audio(backgroundAudio.src);
      newAudio.volume = 0.4;
      newAudio.loop = true;
      newAudio.play().catch(e => console.log("Audio failed:", e));
    });
  }
}

function startCountdown(duration, callback) {
  let timeLeft = duration;
  countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
  const countdownInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(countdownInterval);
      countdownElement.textContent = "SYSTEM ONLINE";
      setTimeout(callback, 300);
    } else {
      countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
    }
  }, 100);
}

function startRadarSystem() {
  blackOverlay.style.display = 'none';
  startGeoCycle(Date.now());
  drawEverything();
}

function initDeviceOrientation() {
  backgroundAudio.volume = 0.4;

  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              deviceOrientation.available = true;
              enableButton.disabled = true;
              enableButton.textContent = "INITIALIZING...";
              startCountdown(.8, startRadarSystem);
            }
          })
          .catch(console.error);
      });
    } else {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        window.addEventListener('deviceorientation', handleOrientation);
        deviceOrientation.available = true;
        enableButton.disabled = true;
        enableButton.textContent = "INITIALIZING...";
        startCountdown(.8, startRadarSystem);
      });
    }
  } else {
    enableButton.addEventListener('click', () => {
      playBackgroundAudio();
      setupMouseOrientation();
      enableButton.disabled = true;
      enableButton.textContent = "INITIALIZING...";
      startCountdown(.8, startRadarSystem);
    });
  }
}

function handleOrientation(event) {
  if (event.alpha !== null) {
    deviceOrientation.alpha = event.alpha;
    deviceOrientation.beta = event.beta;
    deviceOrientation.gamma = event.gamma;
    compassDirection = event.alpha;
    updateBorderHighlights();
  }
}

function setupMouseOrientation() {
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const centerX = canvas.width / 2;
    const centerY = canvas.height * 0.72;
    const dx = mx - centerX;
    const dy = my - centerY;
    let angle = Math.atan2(dy, dx) * (180 / Math.PI);
    angle = (angle + 90) % 360;
    if (angle < 0) angle += 360;
    compassDirection = angle;
    updateBorderHighlights();
  });
}

function updateBorderHighlights() {
  const dir = compassDirection;
  const inRadar = (dir >= 315 || dir <= 45);

  borderHighlights.left = false;
  borderHighlights.right = false;
  borderHighlights.bottom = false;

  if (!inRadar) {
    if ((dir > 45 && dir <= 135) || (dir >= 225 && dir < 315)) {
      if (dir >= 225 && dir < 315) borderHighlights.left = true;
      else borderHighlights.right = true;
    } else {
      borderHighlights.bottom = true;
    }
    borderHighlights.intensity = Math.min(1, borderHighlights.intensity + 0.1);
  } else {
    borderHighlights.intensity = Math.max(0, borderHighlights.intensity - 0.05);
  }
}

function isInRadarCone(dir) {
  return (dir >= 315 || dir <= 45);
}

// Draw the "1"/"2" blocks, their numerals, the version label, and ATT/SUS/DEC
// all ON TOP of the bloom so they stay crisp and flat (no glow on the blocks).
function drawLabels() {
  const lcx = canvas.width / 2;
  const lApexY = canvas.height * 0.72;
  const lRadius = canvas.height * 0.62;

  labelLayerCtx.clearRect(0, 0, labelLayerCanvas.width, labelLayerCanvas.height);

  // --- "1" and "2" button BLOCKS (no bloom) ---
  labelLayerCtx.fillStyle = "#32ff32";
  labelLayerCtx.fillRect(lcx - lRadius * 0.65, lApexY + 20, 70, 40);
  labelLayerCtx.fillRect(lcx - lRadius * 0.65, lApexY + 80, 48, 40);

  // --- "1" and "2" numerals (dark, crisp) ---
  labelLayerCtx.fillStyle = "#0b140b";
  labelLayerCtx.font = "28px monospace";
  labelLayerCtx.textAlign = "center";
  labelLayerCtx.textBaseline = "middle";
  labelLayerCtx.fillText("1", lcx - lRadius * 0.63 + 50, lApexY + 44);
  labelLayerCtx.fillText("2", lcx - lRadius * 0.63 + 24, lApexY + 104);

  // --- Version label ---
  labelLayerCtx.fillStyle = "rgba(109, 255, 109, 0.85)";
  labelLayerCtx.font = "14px monospace";
  labelLayerCtx.textAlign = "left";
  labelLayerCtx.textBaseline = "middle";
  labelLayerCtx.fillText(VERSION_LABEL, lcx - lRadius * 0.63, lApexY + 140);

  // --- ATT / SUS / DEC (kept crisp too, no bloom) ---
  labelLayerCtx.fillStyle = "#6dff6d";
  labelLayerCtx.font = "Bold 26px monospace";
  labelLayerCtx.textAlign = "left";
  labelLayerCtx.textBaseline = "alphabetic";
  ["ATT", "SUS", "DEC"].forEach((t, i) => {
    labelLayerCtx.fillText(t, lcx + lRadius * 0.55, lApexY + 35 + i * 36);
  });
}

function updateBloom() {
  bloomTightCtx.clearRect(0, 0, bloomTightCanvas.width, bloomTightCanvas.height);
  bloomTightCtx.drawImage(canvas, 0, 0);

  bloomWideCtx.clearRect(0, 0, bloomWideCanvas.width, bloomWideCanvas.height);
  bloomWideCtx.drawImage(canvas, 0, 0);
}

function drawEverything() {
  const now = Date.now();
  if (!lastRollTime) lastRollTime = now + 5000;
  if (!isRolling && (now - lastRollTime > 300000)) {
    isRolling = true;
    rollOffset = 0;
    rollCount = 0;
    rollSpeed = 30;
  }
  drawRadarUI();
  updateBloom();
  drawLabels();
  requestAnimationFrame(drawEverything);
}

function drawRadarUI() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const now = Date.now();
  updateGeoDot(now);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,2)';
  for (let y = 0; y < canvas.height; y += 5) {
    ctx.fillRect(0, y, canvas.width, .8);
  }

  // Pulsing static
  const staticTimer = Date.now() / 1000;
  const pulse = Math.sin(staticTimer * 2) * 0.5 + 0.5;
  if (pulse > 0.3) {
    const intensity = pulse;
    const numParticles = Math.floor(30 * intensity);
    for (let i = 0; i < numParticles; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const size = Math.random() * 3 + 1;
      const alpha = Math.random() * 0.3 * intensity;
      ctx.fillStyle = `rgba(120, 255, 120, ${alpha})`;
      ctx.fillRect(x, y, size, size);
    }
  }

  // Vertical jitter
  const dotIsFading = (geoPhase === 'stepping' && geoOpacity < 1);
  if (!dotIsFading && Math.random() > 0.97) {
    const jitterAmount = Math.random() * 4 - 2;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    ctx.putImageData(imageData, 0, jitterAmount);
  }

  // GAPPED CIRCLE
  const circleX = canvas.width / 2;
  const circleY = canvas.height * 0.71;
  const circleRadius = 110;
  const lineWidth = 45;
  const visibleSegments = [[232, 315], [45, 130], [137, 225]];

  visibleSegments.forEach(([startDeg, endDeg], index) => {
    const startRad = ((startDeg - 90) * Math.PI / 180);
    const endRad = ((endDeg - 90) * Math.PI / 180);

    let isHighlighted = false;
    let highlightIntensity = 0;

    if (index === 0 && borderHighlights.left) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }
    else if (index === 1 && borderHighlights.right) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }
    else if (index === 2 && borderHighlights.bottom) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }

    if (isHighlighted && highlightIntensity > 0) {
      const baseR = 109, baseG = 255, baseB = 109;
      const targetR = 50, targetG = 255, targetB = 50;
      const r = Math.round(baseR + (targetR - baseR) * highlightIntensity);
      const g = Math.round(baseG + (targetG - baseG) * highlightIntensity);
      const b = Math.round(baseB + (targetB - baseB) * highlightIntensity);
      ctx.lineWidth = lineWidth + (10 * highlightIntensity);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.3 + 0.7 * highlightIntensity})`;
      ctx.shadowBlur = 20 * highlightIntensity;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${0.7 * highlightIntensity})`;
    } else {
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = "rgba(109, 255, 109, 0.3)";
      ctx.shadowBlur = 0;
    }

    ctx.lineCap = 'butt';

    if (endDeg < startDeg) {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, 0, endRad);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, endRad);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  });

  // RADAR ARCS
  const cx = canvas.width / 2;
  const apexY = canvas.height * 0.72;
  const radius = canvas.height * 0.62;
  const startAngle = -Math.PI * 0.73;
  const endAngle   = -Math.PI * 0.27;
  const green = "#6dff6d";

  function polar(r, a) {
    return { x: cx + r * Math.cos(a), y: apexY + r * Math.sin(a) };
  }

  ctx.strokeStyle = green;
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(cx, apexY, radius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.strokeStyle = green;
  ctx.lineWidth = 1;
  const lowerRadius = radius - 10;
  ctx.beginPath();
  ctx.arc(cx, apexY, lowerRadius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.lineWidth = 3;
  [startAngle, endAngle].forEach(a => {
    const p = polar(radius, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, apexY);
  ctx.lineTo(cx, apexY - radius * 1.03);
  ctx.stroke();

  [-0.48, +0.48].forEach(t => {
    const a = startAngle + (endAngle - startAngle) * (t + 1) / 2;
    const p = polar(radius * 1.03, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  // ===== DASHED RANGE RINGS (in-between thickness) =====
  ctx.setLineDash([18, 28]);
  ctx.lineWidth = 3;
  [0.35, 0.55, 0.75].forEach(r => {
    ctx.beginPath();
    ctx.arc(cx, apexY, radius * r, startAngle + 0.03, endAngle - 0.03);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // CLICK DOTS
  for (let i = greenDots.length - 1; i >= 0; i--) {
    const dot = greenDots[i];
    dot.life -= 1.5;
    if (dot.life > 0) {
      ctx.fillStyle = `rgba(109, 255, 109, ${dot.life/100})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(109, 255, 109, ${dot.life/200})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 10, 0, Math.PI * 2);
      ctx.fill();
    } else {
      greenDots.splice(i, 1);
    }
  }

  // NOTE: The "1"/"2" green blocks are NO LONGER drawn here — they're on the label layer
  // so they don't bloom. Everything else (arcs, rings, dot, static) still blooms.

  // ===== GEO DOT =====
  if (geoOpacity > 0.003 && isInRadarCone(geoFrozenDirection)) {
    const dotRadius = 8;
    const r = radius * geoDistance;
    const canvasAngle = (geoFrozenDirection - 90) * (Math.PI / 180);
    const dotX = cx + Math.cos(canvasAngle) * r;
    const dotY = apexY + Math.sin(canvasAngle) * r;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, geoOpacity));

    ctx.shadowBlur = 18;
    ctx.shadowColor = "rgb(50, 255, 50)";

    ctx.fillStyle = "rgb(50, 255, 50)";
    ctx.beginPath();
    ctx.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
    ctx.fill();

    const lineLength = 20;
    const endX = dotX + Math.cos(canvasAngle) * lineLength;
    const endY = dotY + Math.sin(canvasAngle) * lineLength;
    ctx.strokeStyle = "rgb(50, 255, 50)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(dotX, dotY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    ctx.restore();
  }

  // ===== WARP EFFECT =====
  if (!lastWarpTime) {
    lastWarpTime = now;
    warpsThisCycle = Math.floor(Math.random() * 4) + 1;
  }

  if (!warpActive && warpsDone < warpsThisCycle && (now - lastWarpTime > 300000)) {
    warpActive = true;
    warpProgress = 0;
    warpX = Math.random() * canvas.width;
    warpY = Math.random() * canvas.height;
    warpStrength = Math.random() * 80 + 40;
    warpDuration = Math.random() * 60 + 40;
  }

  if (warpActive) {
    warpProgress++;
    let intensity = 0;
    if (warpProgress < warpDuration * 0.3) intensity = warpProgress / (warpDuration * 0.3);
    else if (warpProgress < warpDuration * 0.7) intensity = 1;
    else intensity = 1 - ((warpProgress - warpDuration * 0.7) / (warpDuration * 0.3));

    const currentStrength = warpStrength * intensity;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const tempData = ctx.createImageData(canvas.width, canvas.height);

    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const dx = x - warpX;
        const dy = y - warpY;
        const distance = Math.sqrt(dx*dx + dy*dy);
        const warpAmount = currentStrength / (distance + 10);
        const srcX = Math.max(0, Math.min(canvas.width-1, x + dx * warpAmount * 0.015));
        const srcY = Math.max(0, Math.min(canvas.height-1, y + dy * warpAmount * 0.015));
        const srcIdx = (Math.floor(srcY) * canvas.width + Math.floor(srcX)) * 4;
        const dstIdx = (y * canvas.width + x) * 4;

        if (distance < 150) {
          const colorDistort = 1 + (currentStrength / 300) * (1 - distance/150);
          tempData.data[dstIdx]     = Math.min(255, data[srcIdx] * colorDistort);
          tempData.data[dstIdx + 1] = Math.min(255, data[srcIdx+1] * (colorDistort * 0.7));
          tempData.data[dstIdx + 2] = Math.min(255, data[srcIdx+2] * (colorDistort * 1.3));
          tempData.data[dstIdx + 3] = data[srcIdx + 3];
        } else {
          tempData.data[dstIdx]     = data[srcIdx];
          tempData.data[dstIdx + 1] = data[srcIdx + 1];
          tempData.data[dstIdx + 2] = data[srcIdx + 2];
          tempData.data[dstIdx + 3] = data[srcIdx + 3];
        }
      }
    }
    ctx.putImageData(tempData, 0, 0);

    ctx.fillStyle = `rgba(255, 50, 50, ${intensity * 0.6})`;
    ctx.beginPath();
    ctx.arc(warpX, warpY, 8 + intensity * 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = `rgba(255, 100, 100, ${intensity * 0.4})`;
    ctx.lineWidth = 1 + intensity;
    for (let i = 1; i <= 3; i++) {
      const radius = i * 60 + intensity * 40;
      ctx.beginPath();
      ctx.arc(warpX, warpY, radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (warpProgress >= warpDuration) {
      warpActive = false;
      warpsDone++;
      if (warpsDone >= warpsThisCycle) {
        lastWarpTime = now;
        warpsDone = 0;
        warpsThisCycle = Math.floor(Math.random() * 4) + 1;
      }
    }
  }

  // ===== ROLL EFFECT =====
  if (isRolling) {
    tempCtx.clearRect(0, 0, canvas.width, canvas.height);
    tempCtx.drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    rollOffset += rollSpeed;

    if (rollOffset >= canvas.height) {
      rollOffset = 0;
      rollCount++;
      if (rollCount >= 4) rollSpeed *= 0.7;
      if (rollCount >= maxRolls || rollSpeed < 1) {
        isRolling = false;
        rollOffset = 0;
        rollCount = 0;
        rollSpeed = 30;
        lastRollTime = Date.now();
        ctx.drawImage(tempCanvas, 0, 0);
        return;
      }
    }

    ctx.drawImage(tempCanvas,
      0, canvas.height - rollOffset, canvas.width, rollOffset,
      0, 0, canvas.width, rollOffset
    );
    ctx.drawImage(tempCanvas,
      0, 0, canvas.width, canvas.height - rollOffset,
      0, rollOffset, canvas.width, canvas.height - rollOffset
    );

    ctx.strokeStyle = rollCount < 4 ? 'rgba(255, 50, 50, 0.6)' : 'rgba(120, 255, 120, 0.4)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const lineY = (rollOffset + i * 50) % canvas.height;
      ctx.beginPath();
      ctx.moveTo(0, lineY);
      ctx.lineTo(canvas.width, lineY);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(0, rollOffset - 2, canvas.width, 4);
  }
}

initDeviceOrientation();

</script>
