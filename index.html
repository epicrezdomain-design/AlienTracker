<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radar UI</title>
<style>
  html, body {
    margin: 0;
    background: #0b140b;
    height: 100%;
  }

  canvas {
    display: block;
    margin: auto;
    background: radial-gradient(circle at 50% 70%, #0f2a12, #081008 100%);
  }

  .permission-notice {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 20, 0, 0.9);
    color: #6dff6d;
    padding: 30px;
    border: 2px solid #6dff6d;
    border-radius: 10px;
    font-family: monospace;
    text-align: center;
    z-index: 100;
    width: 80%;
    max-width: 500px;
    box-shadow: 0 0 30px rgba(109, 255, 109, 0.5);
  }

  .enable-button {
    background: #0b140b;
    border: 2px solid #6dff6d;
    color: #6dff6d;
    padding: 15px 30px;
    border-radius: 5px;
    cursor: pointer;
    font-family: monospace;
    font-size: 18px;
    margin-top: 20px;
    transition: all 0.3s;
  }

  .enable-button:hover {
    background: #6dff6d;
    color: #0b140b;
    box-shadow: 0 0 20px rgba(109, 255, 109, 0.8);
  }

  #blackOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 99;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .countdown {
    font-size: 24px;
    color: #32ff32;
    margin-top: 20px;
    font-weight: bold;
    min-height: 30px;
  }
</style>
</head>
<body>

<div id="blackOverlay">
  <div class="permission-notice" id="permissionNotice">
    <h3>⚠️ ALIEN TRACKER INITIALIZATION ⚠️</h3>
    <p>This device requires compass access to activate the geo-locked radar system.</p>
    <p>Ensure you are in a secure location before proceeding.</p>
    <p style="color: #32ff32; font-weight: bold;">HTTPS connection established</p>
    <button class="enable-button" id="enableButton">ENABLE COMPASS TRACKING</button>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<canvas id="radar"></canvas>

<audio id="backgroundAudio" loop preload="auto">
  <source src="https://github.com/epicrezdomain-design/AlienTracker/raw/main/TrackerAmbient.mp3" type="audio/mp3">
  Your browser does not support the audio element.
</audio>

<script>

const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");
const blackOverlay = document.getElementById("blackOverlay");
const enableButton = document.getElementById("enableButton");
const countdownElement = document.getElementById("countdown");
const backgroundAudio = document.getElementById('backgroundAudio');

const VERSION_LABEL = "V.05";

canvas.width = 1280;
canvas.height = 720;

const greenDots = [];

let compassDirection = 0;

// ===== GEO DOT STEPPED APPROACH =====
const STEP_DISTANCES = [0.95, 0.75, 0.55, 0.35, 0.15];
// One delay PER distance (5 total) = time between each dot appearing.
const STEP_DELAYS_MS = [3000, 2000, 1500, 1000, 1000];

const INITIAL_DELAY_MS = 10000;
const STEP_HOLD_MS     = 200;    // dot stays fully bright this long when it appears at each step
const STEP_FADE_MS     = 700;    // then fades out over this long (HOLD + FADE must be < shortest step delay)
const CYCLE_PAUSE_MS   = 4000;

let geoPhase = 'delay';        // 'delay' | 'stepping' | 'pause'
let geoPhaseStart = 0;
let geoFadeStart = 0;
let geoStepIndex = 0;
let geoStepStart = 0;
let geoDistance = STEP_DISTANCES[0];
let geoOpacity = 0;
let geoFrozenDirection = 0;

function startGeoCycle(now) {
  geoPhase = 'delay';
  geoPhaseStart = now;
  geoStepIndex = 0;
  geoStepStart = 0;
  geoDistance = STEP_DISTANCES[0];
  geoOpacity = 0;
  geoFadeStart = 0;
}

function updateGeoDot(now) {
  if (geoPhase === 'delay') {
    geoOpacity = 0;
    if (now - geoPhaseStart >= INITIAL_DELAY_MS) {
      geoPhase = 'stepping';
      geoStepIndex = 0;
      geoStepStart = now;
      geoDistance = STEP_DISTANCES[0];
      geoOpacity = 1;
      geoFrozenDirection = compassDirection;
    }

  } else if (geoPhase === 'stepping') {
    // Every step: dot appears bright, holds briefly, then fades out fast.
    const sinceStep = now - geoStepStart;
    if (sinceStep <= STEP_HOLD_MS) {
      geoOpacity = 1;
    } else {
      const ft = Math.min((sinceStep - STEP_HOLD_MS) / STEP_FADE_MS, 1);
      geoOpacity = 1 - ft;
    }

    if (sinceStep >= STEP_DELAYS_MS[geoStepIndex]) {
      geoStepIndex++;
      geoStepStart = now;
      if (geoStepIndex < STEP_DISTANCES.length) {
        geoDistance = STEP_DISTANCES[geoStepIndex];
        geoOpacity = 1;                // new dot pops in at its new spot
      } else {
        geoPhase = 'pause';
        geoPhaseStart = now;
        geoOpacity = 0;
      }
    }

  } else if (geoPhase === 'pause') {
    geoOpacity = 0;
    if (now - geoPhaseStart >= CYCLE_PAUSE_MS) {
      startGeoCycle(now);
    }
  }
}

// ===== BORDER HIGHLIGHT =====
let borderHighlights = { left: false, right: false, bottom: false, intensity: 0 };
let deviceOrientation = { available: false, alpha: 0, beta: 0, gamma: 0 };

// ===== ROLL EFFECT =====
let isRolling = false;
let rollOffset = 0;
let rollSpeed = 30;
let rollCount = 0;
let maxRolls = 5;
let lastRollTime = 0;

// ===== WARP EFFECT =====
let lastWarpTime = 0;
let warpActive = false;
let warpProgress = 0;
let warpX = 0, warpY = 0, warpStrength = 0, warpDuration = 0;
let warpsThisCycle = 0;
let warpsDone = 0;

const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.width;
tempCanvas.height = canvas.height;
const tempCtx = tempCanvas.getContext('2d');

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  greenDots.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, life: 100 });
});

function playBackgroundAudio() {
  backgroundAudio.volume = 0.4;
  const playPromise = backgroundAudio.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      const newAudio = new Audio(backgroundAudio.src);
      newAudio.volume = 0.4;
      newAudio.loop = true;
      newAudio.play().catch(e => console.log("Audio failed:", e));
    });
  }
}

function startCountdown(duration, callback) {
  let timeLeft = duration;
  countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
  const countdownInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(countdownInterval);
      countdownElement.textContent = "SYSTEM ONLINE";
      setTimeout(callback, 300);
    } else {
      countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
    }
  }, 100);
}

function startRadarSystem() {
  blackOverlay.style.display = 'none';
  startGeoCycle(Date.now());
  drawEverything();
}

function initDeviceOrientation() {
  backgroundAudio.volume = 0.4;

  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              deviceOrientation.available = true;
              enableButton.disabled = true;
              enableButton.textContent = "INITIALIZING...";
              startCountdown(.8, startRadarSystem);
            }
          })
          .catch(console.error);
      });
    } else {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        window.addEventListener('deviceorientation', handleOrientation);
        deviceOrientation.available = true;
        enableButton.disabled = true;
        enableButton.textContent = "INITIALIZING...";
        startCountdown(.8, startRadarSystem);
      });
    }
  } else {
    enableButton.addEventListener('click', () => {
      playBackgroundAudio();
      setupMouseOrientation();
      enableButton.disabled = true;
      enableButton.textContent = "INITIALIZING...";
      startCountdown(.8, startRadarSystem);
    });
  }
}

function handleOrientation(event) {
  if (event.alpha !== null) {
    deviceOrientation.alpha = event.alpha;
    deviceOrientation.beta = event.beta;
    deviceOrientation.gamma = event.gamma;
    compassDirection = event.alpha;
    updateBorderHighlights();
  }
}

function setupMouseOrientation() {
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const centerX = canvas.width / 2;
    const centerY = canvas.height * 0.72;
    const dx = mx - centerX;
    const dy = my - centerY;
    let angle = Math.atan2(dy, dx) * (180 / Math.PI);
    angle = (angle + 90) % 360;
    if (angle < 0) angle += 360;
    compassDirection = angle;
    updateBorderHighlights();
  });
}

function updateBorderHighlights() {
  const dir = compassDirection;
  const inRadar = (dir >= 315 || dir <= 45);

  borderHighlights.left = false;
  borderHighlights.right = false;
  borderHighlights.bottom = false;

  if (!inRadar) {
    if ((dir > 45 && dir <= 135) || (dir >= 225 && dir < 315)) {
      if (dir >= 225 && dir < 315) borderHighlights.left = true;
      else borderHighlights.right = true;
    } else {
      borderHighlights.bottom = true;
    }
    borderHighlights.intensity = Math.min(1, borderHighlights.intensity + 0.1);
  } else {
    borderHighlights.intensity = Math.max(0, borderHighlights.intensity - 0.05);
  }
}

function isInRadarCone(dir) {
  return (dir >= 315 || dir <= 45);
}

function drawEverything() {
  const now = Date.now();
  if (!lastRollTime) lastRollTime = now + 5000;
  if (!isRolling && (now - lastRollTime > 300000)) {
    isRolling = true;
    rollOffset = 0;
    rollCount = 0;
    rollSpeed = 30;
  }
  drawRadarUI();
  requestAnimationFrame(drawEverything);
}

function drawRadarUI() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const now = Date.now();
  updateGeoDot(now);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,2)';
  for (let y = 0; y < canvas.height; y += 5) {
    ctx.fillRect(0, y, canvas.width, .8);
  }

  // Pulsing static
  const staticTimer = Date.now() / 1000;
  const pulse = Math.sin(staticTimer * 2) * 0.5 + 0.5;
  if (pulse > 0.3) {
    const intensity = pulse;
    const numParticles = Math.floor(30 * intensity);
    for (let i = 0; i < numParticles; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const size = Math.random() * 3 + 1;
      const alpha = Math.random() * 0.3 * intensity;
      ctx.fillStyle = `rgba(120, 255, 120, ${alpha})`;
      ctx.fillRect(x, y, size, size);
    }
  }

  // Vertical jitter (skip during fade so it doesn't smear the fading dot)
  const dotIsFading = (geoPhase === 'stepping' && geoOpacity < 1);
  if (!dotIsFading && Math.random() > 0.97) {
    const jitterAmount = Math.random() * 4 - 2;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    ctx.putImageData(imageData, 0, jitterAmount);
  }

  // GAPPED CIRCLE
  const circleX = canvas.width / 2;
  const circleY = canvas.height * 0.71;
  const circleRadius = 110;
  const lineWidth = 45;
  const visibleSegments = [[232, 315], [45, 130], [137, 225]];

  visibleSegments.forEach(([startDeg, endDeg], index) => {
    const startRad = ((startDeg - 90) * Math.PI / 180);
    const endRad = ((endDeg - 90) * Math.PI / 180);

    let isHighlighted = false;
    let highlightIntensity = 0;

    if (index === 0 && borderHighlights.left) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }
    else if (index === 1 && borderHighlights.right) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }
    else if (index === 2 && borderHighlights.bottom) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }

    if (isHighlighted && highlightIntensity > 0) {
      const baseR = 109, baseG = 255, baseB = 109;
      const targetR = 50, targetG = 255, targetB = 50;
      const r = Math.round(baseR + (targetR - baseR) * highlightIntensity);
      const g = Math.round(baseG + (targetG - baseG) * highlightIntensity);
      const b = Math.round(baseB + (targetB - baseB) * highlightIntensity);
      ctx.lineWidth = lineWidth + (10 * highlightIntensity);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.3 + 0.7 * highlightIntensity})`;
      ctx.shadowBlur = 20 * highlightIntensity;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${0.7 * highlightIntensity})`;
    } else {
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = "rgba(109, 255, 109, 0.3)";
      ctx.shadowBlur = 0;
    }

    ctx.lineCap = 'butt';

    if (endDeg < startDeg) {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, 0, endRad);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, endRad);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  });

  // RADAR ARCS
  const cx = canvas.width / 2;
  const apexY = canvas.height * 0.72;
  const radius = canvas.height * 0.62;
  const startAngle = -Math.PI * 0.73;
  const endAngle   = -Math.PI * 0.27;
  const green = "#6dff6d";

  function polar(r, a) {
    return { x: cx + r * Math.cos(a), y: apexY + r * Math.sin(a) };
  }

  ctx.strokeStyle = green;
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(cx, apexY, radius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.strokeStyle = green;
  ctx.lineWidth = 1;
  const lowerRadius = radius - 10;
  ctx.beginPath();
  ctx.arc(cx, apexY, lowerRadius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.lineWidth = 3;
  [startAngle, endAngle].forEach(a => {
    const p = polar(radius, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, apexY);
  ctx.lineTo(cx, apexY - radius * 1.03);
  ctx.stroke();

  [-0.48, +0.48].forEach(t => {
    const a = startAngle + (endAngle - startAngle) * (t + 1) / 2;
    const p = polar(radius * 1.03, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  ctx.setLineDash([15, 30]);
  ctx.lineWidth = 1.5;
  [0.35, 0.55, 0.75].forEach(r => {
    ctx.beginPath();
    ctx.arc(cx, apexY, radius * r, startAngle + 0.03, endAngle - 0.03);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // CLICK DOTS
  for (let i = greenDots.length - 1; i >= 0; i--) {
    const dot = greenDots[i];
    dot.life -= 1.5;
    if (dot.life > 0) {
      ctx.fillStyle = `rgba(109, 255, 109, ${dot.life/100})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(109, 255, 109, ${dot.life/200})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 10, 0, Math.PI * 2);
      ctx.fill();
    } else {
      greenDots.splice(i, 1);
    }
  }

  // Left buttons
  ctx.fillStyle = "#32ff32";
  ctx.fillRect(cx - radius * 0.65, apexY + 20, 70, 40);
  ctx.fillRect(cx - radius * 0.65, apexY + 80, 48, 40);

  ctx.fillStyle = "#0b140b";
  ctx.font = "28px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("1", cx - radius * 0.63 + 50, apexY + 44);
  ctx.fillText("2", cx - radius * 0.63 + 24, apexY + 104);

  // Version label under the "2" button
  ctx.fillStyle = "rgba(109, 255, 109, 0.75)";
  ctx.font = "14px monospace";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText(VERSION_LABEL, cx - radius * 0.63, apexY + 140);

  // Right labels
  ctx.fillStyle = green;
  ctx.font = "Bold 26px monospace";
  ctx.textAlign = "left";
  ["ATT", "SUS", "DEC"].forEach((t, i) => {
    ctx.fillText(t, cx + radius * 0.55, apexY + 35 + i * 36);
  });

  // ===== GEO DOT =====
  // Drawn with globalAlpha so the dot, glow and line all fade together.
  if (geoOpacity > 0.003 && isInRadarCone(geoFrozenDirection)) {
    const dotRadius = 8;
    const r = radius * geoDistance;
    const canvasAngle = (geoFrozenDirection - 90) * (Math.PI / 180);
    const dotX = cx + Math.cos(canvasAngle) * r;
    const dotY = apexY + Math.sin(canvasAngle) * r;

    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, geoOpacity));

    // Soft glow
    ctx.shadowBlur = 18;
    ctx.shadowColor = "rgb(50, 255, 50)";

    // Core dot
    ctx.fillStyle = "rgb(50, 255, 50)";
    ctx.beginPath();
    ctx.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
    ctx.fill();

    // Direction line
    const lineLength = 20;
    const endX = dotX + Math.cos(canvasAngle) * lineLength;
    const endY = dotY + Math.sin(canvasAngle) * lineLength;
    ctx.strokeStyle = "rgb(50, 255, 50)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(dotX, dotY);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    ctx.restore();
  }

  // ===== WARP EFFECT =====
  if (!lastWarpTime) {
    lastWarpTime = now;
    warpsThisCycle = Math.floor(Math.random() * 4) + 1;
  }

  if (!warpActive && warpsDone < warpsThisCycle && (now - lastWarpTime > 300000)) {
    warpActive = true;
    warpProgress = 0;
    warpX = Math.random() * canvas.width;
    warpY = Math.random() * canvas.height;
    warpStrength = Math.random() * 80 + 40;
    warpDuration = Math.random() * 60 + 40;
  }

  if (warpActive) {
    warpProgress++;
    let intensity = 0;
    if (warpProgress < warpDuration * 0.3) intensity = warpProgress / (warpDuration * 0.3);
    else if (warpProgress < warpDuration * 0.7) intensity = 1;
    else intensity = 1 - ((warpProgress - warpDuration * 0.7) / (warpDuration * 0.3));

    const currentStrength = warpStrength * intensity;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const tempData = ctx.createImageData(canvas.width, canvas.height);

    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        const dx = x - warpX;
        const dy = y - warpY;
        const distance = Math.sqrt(dx*dx + dy*dy);
        const warpAmount = currentStrength / (distance + 10);
        const srcX = Math.max(0, Math.min(canvas.width-1, x + dx * warpAmount * 0.015));
        const srcY = Math.max(0, Math.min(canvas.height-1, y + dy * warpAmount * 0.015));
        const srcIdx = (Math.floor(srcY) * canvas.width + Math.floor(srcX)) * 4;
        const dstIdx = (y * canvas.width + x) * 4;

        if (distance < 150) {
          const colorDistort = 1 + (currentStrength / 300) * (1 - distance/150);
          tempData.data[dstIdx]     = Math.min(255, data[srcIdx] * colorDistort);
          tempData.data[dstIdx + 1] = Math.min(255, data[srcIdx+1] * (colorDistort * 0.7));
          tempData.data[dstIdx + 2] = Math.min(255, data[srcIdx+2] * (colorDistort * 1.3));
          tempData.data[dstIdx + 3] = data[srcIdx + 3];
        } else {
          tempData.data[dstIdx]     = data[srcIdx];
          tempData.data[dstIdx + 1] = data[srcIdx + 1];
          tempData.data[dstIdx + 2] = data[srcIdx + 2];
          tempData.data[dstIdx + 3] = data[srcIdx + 3];
        }
      }
    }
    ctx.putImageData(tempData, 0, 0);

    ctx.fillStyle = `rgba(255, 50, 50, ${intensity * 0.6})`;
    ctx.beginPath();
    ctx.arc(warpX, warpY, 8 + intensity * 25, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = `rgba(255, 100, 100, ${intensity * 0.4})`;
    ctx.lineWidth = 1 + intensity;
    for (let i = 1; i <= 3; i++) {
      const radius = i * 60 + intensity * 40;
      ctx.beginPath();
      ctx.arc(warpX, warpY, radius, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (warpProgress >= warpDuration) {
      warpActive = false;
      warpsDone++;
      if (warpsDone >= warpsThisCycle) {
        lastWarpTime = now;
        warpsDone = 0;
        warpsThisCycle = Math.floor(Math.random() * 4) + 1;
      }
    }
  }

  // ===== ROLL EFFECT =====
  if (isRolling) {
    tempCtx.clearRect(0, 0, canvas.width, canvas.height);
    tempCtx.drawImage(canvas, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    rollOffset += rollSpeed;

    if (rollOffset >= canvas.height) {
      rollOffset = 0;
      rollCount++;
      if (rollCount >= 4) rollSpeed *= 0.7;
      if (rollCount >= maxRolls || rollSpeed < 1) {
        isRolling = false;
        rollOffset = 0;
        rollCount = 0;
        rollSpeed = 30;
        lastRollTime = Date.now();
        ctx.drawImage(tempCanvas, 0, 0);
        return;
      }
    }

    ctx.drawImage(tempCanvas,
      0, canvas.height - rollOffset, canvas.width, rollOffset,
      0, 0, canvas.width, rollOffset
    );
    ctx.drawImage(tempCanvas,
      0, 0, canvas.width, canvas.height - rollOffset,
      0, rollOffset, canvas.width, canvas.height - rollOffset
    );

    ctx.strokeStyle = rollCount < 4 ? 'rgba(255, 50, 50, 0.6)' : 'rgba(120, 255, 120, 0.4)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const lineY = (rollOffset + i * 50) % canvas.height;
      ctx.beginPath();
      ctx.moveTo(0, lineY);
      ctx.lineTo(canvas.width, lineY);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(0, rollOffset - 2, canvas.width, 4);
  }
}

initDeviceOrientation();

</script>
</body>
</html>
