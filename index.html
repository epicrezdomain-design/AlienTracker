<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radar UI</title>
<style>
  html, body {
    margin: 0;
    background: #0b140b;
    height: 100%;
  }

  /* ===== CRT LOOK - tweak these to taste ===== */
  :root {
    --bloom-tight:  0.75;
    --bloom-wide:   0.35;
    --fringe:       0.55;
    --grain:        0.16;
    --vignette:     0.45;
  }

  .crt {
    position: relative;
    width: 1280px;
    height: 720px;
    margin: auto;
    overflow: hidden;
    isolation: isolate;
    border-radius: 22px;
    background: radial-gradient(ellipse 62% 78% at 50% 71%,
      rgb(34,122,60) 0%, rgb(34,98,57) 22%, rgb(38,82,60) 48%, rgb(44,78,64) 72%, rgb(30,62,46) 100%);
  }

  canvas#radar {
    display: block;
    filter: blur(1.1px);
  }

  .bloom, .grain, .label-layer, .crt-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  .bloom { mix-blend-mode: lighten; }
  .bloom-tight { filter: blur(3px);                                   opacity: var(--bloom-tight); }
  .bloom-wide  { filter: blur(16px) brightness(1.2);                  opacity: var(--bloom-wide);
                 animation: crtFlicker 5s infinite; }
  .bloom-fringe{ filter: hue-rotate(58deg) saturate(1.5) brightness(1.05);
                 transform: translateX(-1.6px); opacity: var(--fringe); }

  .grain { mix-blend-mode: soft-light; opacity: var(--grain); }

  /* keeps the dark "1" / "2" and the green labels readable through the glow */
  .label-layer { filter: blur(0.5px); }

  .crt-overlay {
    background: radial-gradient(ellipse at 50% 52%, rgba(0,0,0,0) 48%, rgba(0,0,0,var(--vignette)) 100%);
    box-shadow: inset 0 0 70px rgba(0,0,0,0.45);
  }

  @keyframes crtFlicker {
    0%, 100% { opacity: var(--bloom-wide); }
    8%       { opacity: calc(var(--bloom-wide) * 0.88); }
    12%      { opacity: var(--bloom-wide); }
    47%      { opacity: calc(var(--bloom-wide) * 0.94); }
    52%      { opacity: var(--bloom-wide); }
    80%      { opacity: calc(var(--bloom-wide) * 0.90); }
  }
</style>
</head>
<body>

<div id="blackOverlay">
  <div class="permission-notice" id="permissionNotice">
    <h3>⚠️ ALIEN TRACKER INITIALIZATION ⚠️</h3>
    <p>This device requires compass access to activate the geo-locked radar system.</p>
    <p>Ensure you are in a secure location before proceeding.</p>
    <p style="color: #32ff32; font-weight: bold;">HTTPS connection established</p>
    <button class="enable-button" id="enableButton">ENABLE COMPASS TRACKING</button>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<div class="crt" id="crt">
  <canvas id="radar"></canvas>
  <canvas id="bloomTight"  class="bloom bloom-tight"  width="640" height="360"></canvas>
  <canvas id="bloomWide"   class="bloom bloom-wide"   width="320" height="180"></canvas>
  <canvas id="bloomFringe" class="bloom bloom-fringe" width="1280" height="720"></canvas>
  <canvas id="grainLayer"  class="grain" width="160" height="90"></canvas>
  <canvas id="labelLayer"  class="label-layer" width="1280" height="720"></canvas>
  <div class="crt-overlay"></div>
</div>

<audio id="backgroundAudio" loop preload="auto">
  <source src="https://github.com/epicrezdomain-design/AlienTracker/raw/main/TrackerAmbient.mp3" type="audio/mp3">
  Your browser does not support the audio element.
</audio>

<script>

const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");
const blackOverlay = document.getElementById("blackOverlay");
const enableButton = document.getElementById("enableButton");
const countdownElement = document.getElementById("countdown");
const backgroundAudio = document.getElementById('backgroundAudio');

const VERSION_LABEL = "V.10";

canvas.width = 1280;
canvas.height = 720;

// ===== CRT LOOK =====
const bloomTightCanvas  = document.getElementById('bloomTight');
const bloomWideCanvas   = document.getElementById('bloomWide');
const bloomFringeCanvas = document.getElementById('bloomFringe');
const bloomTightCtx  = bloomTightCanvas.getContext('2d');
const bloomWideCtx   = bloomWideCanvas.getContext('2d');
const bloomFringeCtx = bloomFringeCanvas.getContext('2d');
[bloomTightCtx, bloomWideCtx, bloomFringeCtx].forEach(c => { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; });

// Label layer: redraws ALL text (1, 2, ATT, SUS, DEC, version) ABOVE the bloom so it stays crisp.
(function drawButtonLabels() {
  const lctx = document.getElementById('labelLayer').getContext('2d');
  const lcx = canvas.width / 2;
  const lApexY = canvas.height * 0.72;
  const lRadius = canvas.height * 0.62;

  // "1" and "2" on the buttons
  lctx.fillStyle = "rgba(21, 111, 47, 0.9)";
  lctx.font = "28px monospace";
  lctx.textAlign = "center";
  lctx.textBaseline = "middle";
  lctx.fillText("1", lcx - lRadius * 0.63 + 50, lApexY + 44);
  lctx.fillText("2", lcx - lRadius * 0.63 + 24, lApexY + 104);

  // Version label
  lctx.fillStyle = "rgba(120, 240, 170, 0.9)";
  lctx.font = "14px monospace";
  lctx.textAlign = "left";
  lctx.textBaseline = "middle";
  lctx.fillText(VERSION_LABEL, lcx - lRadius * 0.63, lApexY + 140);

  // ATT / SUS / DEC — same transform as the canvas version so they align exactly
  lctx.fillStyle = "#4dff88";
  lctx.strokeStyle = "#4dff88";
  lctx.lineWidth = 1.6;
  lctx.font = "Bold 36px monospace";
  lctx.textAlign = "left";
  lctx.textBaseline = "middle";
  ["ATT", "SUS", "DEC"].forEach((t, i) => {
    lctx.save();
    lctx.translate(lcx + lRadius * 0.55, lApexY + 35 + i * 42);
    lctx.scale(0.74, 1);
    lctx.fillText(t, 0, 0);
    lctx.strokeText(t, 0, 0);
    lctx.restore();
  });
})();

// Grain
(function drawGrain() {
  const g = document.getElementById('grainLayer');
  const gctx = g.getContext('2d');
  const tiny = document.createElement('canvas');
  tiny.width = 22; tiny.height = 12;
  const tctx = tiny.getContext('2d');
  for (let y = 0; y < tiny.height; y++) {
    for (let x = 0; x < tiny.width; x++) {
      const v = Math.floor(70 + Math.random() * 120);
      tctx.fillStyle = `rgb(${v},${v},${v})`;
      tctx.fillRect(x, y, 1, 1);
    }
  }
  gctx.imageSmoothingEnabled = true;
  gctx.imageSmoothingQuality = 'high';
  gctx.drawImage(tiny, 0, 0, g.width, g.height);
  const img = gctx.getImageData(0, 0, g.width, g.height);
  for (let i = 0; i < img.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 50;
    img.data[i]     = Math.max(0, Math.min(255, img.data[i] + n));
    img.data[i + 1] = Math.max(0, Math.min(255, img.data[i + 1] + n));
    img.data[i + 2] = Math.max(0, Math.min(255, img.data[i + 2] + n));
  }
  gctx.putImageData(img, 0, 0);
})();

function squareAlpha(bctx, c, passes) {
  bctx.globalCompositeOperation = 'destination-in';
  for (let i = 0; i < passes; i++) bctx.drawImage(c, 0, 0);
  bctx.globalCompositeOperation = 'source-over';
}

function updateBloom() {
  bloomTightCtx.clearRect(0, 0, bloomTightCanvas.width, bloomTightCanvas.height);
  bloomTightCtx.drawImage(canvas, 0, 0, bloomTightCanvas.width, bloomTightCanvas.height);
  squareAlpha(bloomTightCtx, bloomTightCanvas, 1);

  bloomFringeCtx.clearRect(0, 0, bloomFringeCanvas.width, bloomFringeCanvas.height);
  bloomFringeCtx.drawImage(canvas, 0, 0);
  squareAlpha(bloomFringeCtx, bloomFringeCanvas, 2);

  bloomWideCtx.clearRect(0, 0, bloomWideCanvas.width, bloomWideCanvas.height);
  bloomWideCtx.drawImage(bloomTightCanvas, 0, 0, bloomWideCanvas.width, bloomWideCanvas.height);
}

const greenDots = [];
let compassDirection = 0;

// ===== GEO DOT SEQUENCE =====
const APPROACH_DISTANCES = [0.95, 0.75, 0.55, 0.35];
const APPROACH_DELAYS_MS = [3000, 2000, 1500, 1000];
const CLOSEST_DISTANCE   = 0.15;
const LEAVE_DISTANCES    = [0.35, 0.55, 0.75, 0.95];
const LEAVE_DELAYS_MS    = [1500, 2000, 3000, 1500];

const DISTANCE_JITTER  = 0.06;
const MIN_DISTANCE_GAP = 0.08;
const DELAY_JITTER     = 0.25;
const MIN_DELAY_MS     = 1000;

const CLOSEST_BLEEPS          = 7;
const CLOSEST_BLEEPS_VARIANCE = 1;
const CLOSEST_DELAY_MIN_MS    = 1000;
const CLOSEST_DELAY_MAX_MS    = 1400;
const CLOSEST_WOBBLE          = 0.01;

const INITIAL_DELAY_MS = 10000;
const STEP_HOLD_MS     = 200;
const STEP_FADE_MS     = 700;
const CYCLE_PAUSE_MS   = 4000;

function rand(min, max) { return min + Math.random() * (max - min); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function jitterDelay(ms) {
  return Math.max(MIN_DELAY_MS, Math.round(ms * (1 + rand(-DELAY_JITTER, DELAY_JITTER))));
}

function jitterDistances(base, closer) {
  const out = base.map(d => clamp(d + rand(-DISTANCE_JITTER, DISTANCE_JITTER), 0.22, 0.98));
  out.sort((x, y) => closer ? y - x : x - y);
  for (let i = 1; i < out.length; i++) {
    out[i] = closer ? Math.min(out[i], out[i - 1] - MIN_DISTANCE_GAP)
                    : Math.max(out[i], out[i - 1] + MIN_DISTANCE_GAP);
  }
  return out.map(d => clamp(d, 0.22, 0.98));
}

function buildGeoSequence() {
  const seq = [];
  const inD = jitterDistances(APPROACH_DISTANCES, true);
  inD.forEach((d, i) => seq.push({ dist: d, delay: jitterDelay(APPROACH_DELAYS_MS[i]) }));

  const bleeps = CLOSEST_BLEEPS + Math.floor(rand(-CLOSEST_BLEEPS_VARIANCE, CLOSEST_BLEEPS_VARIANCE + 1));
  for (let i = 0; i < bleeps; i++) {
    seq.push({
      dist: CLOSEST_DISTANCE + rand(-CLOSEST_WOBBLE, CLOSEST_WOBBLE),
      delay: Math.round(rand(CLOSEST_DELAY_MIN_MS, CLOSEST_DELAY_MAX_MS))
    });
  }

  const outD = jitterDistances(LEAVE_DISTANCES, false);
  outD.forEach((d, i) => seq.push({ dist: d, delay: jitterDelay(LEAVE_DELAYS_MS[i]) }));

  return seq;
}

let geoSequence = buildGeoSequence();
let geoPhase = 'delay';
let geoPhaseStart = 0;
let geoFadeStart = 0;
let geoStepIndex = 0;
let geoStepStart = 0;
let geoDistance = geoSequence[0].dist;
let geoOpacity = 0;
let geoFrozenDirection = 0;

function startGeoCycle(now) {
  geoSequence = buildGeoSequence();
  geoPhase = 'delay';
  geoPhaseStart = now;
  geoStepIndex = 0;
  geoStepStart = 0;
  geoDistance = geoSequence[0].dist;
  geoOpacity = 0;
  geoFadeStart = 0;
}

function updateGeoDot(now) {
  if (geoPhase === 'delay') {
    geoOpacity = 0;
    if (now - geoPhaseStart >= INITIAL_DELAY_MS) {
      geoPhase = 'stepping';
      geoStepIndex = 0;
      geoStepStart = now;
      geoDistance = geoSequence[0].dist;
      geoOpacity = 1;
      geoFrozenDirection = compassDirection;
    }
  } else if (geoPhase === 'stepping') {
    const sinceStep = now - geoStepStart;
    if (sinceStep <= STEP_HOLD_MS) {
      geoOpacity = 1;
    } else {
      const ft = Math.min((sinceStep - STEP_HOLD_MS) / STEP_FADE_MS, 1);
      geoOpacity = 1 - ft;
    }

    if (sinceStep >= geoSequence[geoStepIndex].delay) {
      geoStepIndex++;
      geoStepStart = now;
      if (geoStepIndex < geoSequence.length) {
        geoDistance = geoSequence[geoStepIndex].dist;
        geoOpacity = 1;
      } else {
        geoPhase = 'pause';
        geoPhaseStart = now;
        geoOpacity = 0;
      }
    }
  } else if (geoPhase === 'pause') {
    geoOpacity = 0;
    if (now - geoPhaseStart >= CYCLE_PAUSE_MS) {
      startGeoCycle(now);
    }
  }
}

let borderHighlights = { left: false, right: false, bottom: false, intensity: 0 };
let deviceOrientation = { available: false, alpha: 0, beta: 0, gamma: 0 };

let isRolling = false, rollOffset = 0, rollSpeed = 30, rollCount = 0, maxRolls = 5, lastRollTime = 0;
let lastWarpTime = 0, warpActive = false, warpProgress = 0, warpX = 0, warpY = 0, warpStrength = 0, warpDuration = 0, warpsThisCycle = 0, warpsDone = 0;

const tempCanvas = document.createElement('canvas');
tempCanvas.width = canvas.width;
tempCanvas.height = canvas.height;
const tempCtx = tempCanvas.getContext('2d');

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  greenDots.push({ x: e.clientX - rect.left, y: e.clientY - rect.top, life: 100 });
});

function playBackgroundAudio() {
  backgroundAudio.volume = 0.4;
  const playPromise = backgroundAudio.play();
  if (playPromise !== undefined) {
    playPromise.catch(() => {
      const newAudio = new Audio(backgroundAudio.src);
      newAudio.volume = 0.4;
      newAudio.loop = true;
      newAudio.play().catch(e => console.log("Audio failed:", e));
    });
  }
}

function startCountdown(duration, callback) {
  let timeLeft = duration;
  countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
  const countdownInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(countdownInterval);
      countdownElement.textContent = "SYSTEM ONLINE";
      setTimeout(callback, 300);
    } else {
      countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
    }
  }, 100);
}

function startRadarSystem() {
  blackOverlay.style.display = 'none';
  startGeoCycle(Date.now());
  drawEverything();
}

function initDeviceOrientation() {
  backgroundAudio.volume = 0.4;

  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              deviceOrientation.available = true;
              enableButton.disabled = true;
              enableButton.textContent = "INITIALIZING...";
              startCountdown(.8, startRadarSystem);
            }
          })
          .catch(console.error);
      });
    } else {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        window.addEventListener('deviceorientation', handleOrientation);
        deviceOrientation.available = true;
        enableButton.disabled = true;
        enableButton.textContent = "INITIALIZING...";
        startCountdown(.8, startRadarSystem);
      });
    }
  } else {
    enableButton.addEventListener('click', () => {
      playBackgroundAudio();
      setupMouseOrientation();
      enableButton.disabled = true;
      enableButton.textContent = "INITIALIZING...";
      startCountdown(.8, startRadarSystem);
    });
  }
}

function handleOrientation(event) {
  if (event.alpha !== null) {
    deviceOrientation.alpha = event.alpha;
    deviceOrientation.beta = event.beta;
    deviceOrientation.gamma = event.gamma;
    compassDirection = event.alpha;
    updateBorderHighlights();
  }
}

function setupMouseOrientation() {
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const centerX = canvas.width / 2;
    const centerY = canvas.height * 0.72;
    const dx = mx - centerX;
    const dy = my - centerY;
    let angle = Math.atan2(dy, dx) * (180 / Math.PI);
    angle = (angle + 90) % 360;
    if (angle < 0) angle += 360;
    compassDirection = angle;
    updateBorderHighlights();
  });
}

function updateBorderHighlights() {
  const dir = compassDirection;
  const inRadar = (dir >= 315 || dir <= 45);

  borderHighlights.left = false;
  borderHighlights.right = false;
  borderHighlights.bottom = false;

  if (!inRadar) {
    if ((dir > 45 && dir <= 135) || (dir >= 225 && dir < 315)) {
      if (dir >= 225 && dir < 315) borderHighlights.left = true;
      else borderHighlights.right = true;
    } else {
      borderHighlights.bottom = true;
    }
    borderHighlights.intensity = Math.min(1, borderHighlights.intensity + 0.1);
  } else {
    borderHighlights.intensity = Math.max(0, borderHighlights.intensity - 0.05);
  }
}

function isInRadarCone(dir) {
  return (dir >= 315 || dir <= 45);
}

function drawEverything() {
  const now = Date.now();
  if (!lastRollTime) lastRollTime = now + 5000;
  if (!isRolling && (now - lastRollTime > 300000)) {
    isRolling = true;
    rollOffset = 0;
    rollCount = 0;
    rollSpeed = 30;
  }
  drawRadarUI();
  updateBloom();
  requestAnimationFrame(drawEverything);
}

function drawRadarUI() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const now = Date.now();
  updateGeoDot(now);

  // Scanlines
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = 0; y < canvas.height; y += 5) {
    ctx.fillRect(0, y, canvas.width, .8);
  }

  // Pulsing static
  const staticTimer = Date.now() / 1000;
  const pulse = Math.sin(staticTimer * 2) * 0.5 + 0.5;
  if (pulse > 0.3) {
    const intensity = pulse;
    const numParticles = Math.floor(30 * intensity);
    for (let i = 0; i < numParticles; i++) {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const size = Math.random() * 3 + 1;
      const alpha = Math.random() * 0.3 * intensity;
      ctx.fillStyle = `rgba(120, 255, 120, ${alpha})`;
      ctx.fillRect(x, y, size, size);
    }
  }

  // Vertical jitter
  const dotIsFading = (geoPhase === 'stepping' && geoOpacity < 1);
  if (!dotIsFading && Math.random() > 0.97) {
    const jitterAmount = Math.random() * 4 - 2;
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    ctx.putImageData(imageData, 0, jitterAmount);
  }

  // GAPPED CIRCLE — ring glow now GREENER
  const circleX = canvas.width / 2;
  const circleY = canvas.height * 0.71;
  const circleRadius = 110;
  const lineWidth = 45;
  const visibleSegments = [[232, 315], [45, 130], [137, 225]];
  const RING_BLUR = 10;
  const RING_OFF  = 5000;

  visibleSegments.forEach(([startDeg, endDeg], index) => {
    const startRad = ((startDeg - 90) * Math.PI / 180);
    const endRad = ((endDeg - 90) * Math.PI / 180);

    let isHighlighted = false;
    let highlightIntensity = 0;

    if (index === 0 && borderHighlights.left) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }
    else if (index === 1 && borderHighlights.right) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }
    else if (index === 2 && borderHighlights.bottom) { isHighlighted = true; highlightIntensity = borderHighlights.intensity; }

    ctx.save();
    ctx.translate(RING_OFF, 0);
    ctx.shadowOffsetX = -RING_OFF;
    ctx.shadowOffsetY = 0;
    ctx.strokeStyle = "#000";

    if (isHighlighted && highlightIntensity > 0) {
      // GREENER highlight: pull toward a bright pure green instead of mint
      const r = Math.round(40 + (60 - 40) * highlightIntensity);
      const g = Math.round(230 + (255 - 230) * highlightIntensity);
      const b = Math.round(90 + (120 - 90) * highlightIntensity);
      ctx.lineWidth = lineWidth + (10 * highlightIntensity);
      ctx.shadowBlur = RING_BLUR;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${0.20 + 0.75 * highlightIntensity})`;
    } else {
      ctx.lineWidth = lineWidth;
      ctx.shadowBlur = RING_BLUR;
      ctx.shadowColor = "rgba(50, 225, 90, 0.22)";   // greener base ring
    }

    ctx.lineCap = 'butt';

    if (endDeg < startDeg) {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, 0, endRad);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, endRad);
      ctx.stroke();
    }
    ctx.restore();
  });

  // RADAR ARCS — shifted from mint/cyan to pure greens
  const cx = canvas.width / 2;
  const apexY = canvas.height * 0.72;
  const radius = canvas.height * 0.62;
  const startAngle = -Math.PI * 0.73;
  const endAngle   = -Math.PI * 0.27;

  const ARC_COLOR   = "#4dff88";   // was mint #99e7d4 — now bright green
  const ARC2_COLOR  = "#3df07a";   // was cyan-mint #90e3c6
  const EDGE_COLOR  = "#45f57e";   // was #93ecb5
  const LINE_COLOR  = "#3ee06e";   // was #93e2b0
  const green = "#4dff88";         // labels

  function polar(r, a) {
    return { x: cx + r * Math.cos(a), y: apexY + r * Math.sin(a) };
  }

  ctx.lineCap = 'butt';

  ctx.strokeStyle = ARC_COLOR;
  ctx.lineWidth = 15;
  ctx.beginPath();
  ctx.arc(cx, apexY, radius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.strokeStyle = ARC2_COLOR;
  ctx.lineWidth = 7;
  const lowerRadius = radius - 13;
  ctx.beginPath();
  ctx.arc(cx, apexY, lowerRadius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.strokeStyle = EDGE_COLOR;
  ctx.lineWidth = 8;
  [startAngle, endAngle].forEach(a => {
    const p = polar(radius, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  ctx.strokeStyle = LINE_COLOR;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(cx, apexY);
  ctx.lineTo(cx, apexY - radius * 1.035);
  ctx.stroke();

  [-0.48, +0.48].forEach(t => {
    const a = startAngle + (endAngle - startAngle) * (t + 1) / 2;
    const p = polar(radius * 1.035, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  ctx.lineCap = 'round';
  ctx.setLineDash([14, 26]);
  ctx.lineWidth = 6.5;
  ctx.strokeStyle = LINE_COLOR;
  [0.35, 0.55, 0.75].forEach(r => {
    ctx.beginPath();
    ctx.arc(cx, apexY, radius * r, startAngle + 0.03, endAngle - 0.03);
    ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.lineCap = 'butt';

  // CLICK DOTS
  for (let i = greenDots.length - 1; i >= 0; i--) {
    const dot = greenDots[i];
    dot.life -= 1.5;
    if (dot.life > 0) {
      ctx.fillStyle = `rgba(109, 255, 109, ${dot.life/100})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 6, 0, Math.PI * 2);
      ctx.fill();
