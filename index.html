<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Radar UI</title>
<style>
  html, body {
    margin: 0;
    background: #0b140b;
    height: 100%;
  }

  canvas {
    display: block;
    margin: auto;
    background: radial-gradient(circle at 50% 70%, #0f2a12, #081008 100%);
  }

  .permission-notice {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 20, 0, 0.9);
    color: #6dff6d;
    padding: 30px;
    border: 2px solid #6dff6d;
    border-radius: 10px;
    font-family: monospace;
    text-align: center;
    z-index: 100;
    width: 80%;
    max-width: 500px;
    box-shadow: 0 0 30px rgba(109, 255, 109, 0.5);
  }

  .enable-button {
    background: #0b140b;
    border: 2px solid #6dff6d;
    color: #6dff6d;
    padding: 15px 30px;
    border-radius: 5px;
    cursor: pointer;
    font-family: monospace;
    font-size: 18px;
    margin-top: 20px;
    transition: all 0.3s;
  }

  .enable-button:hover {
    background: #6dff6d;
    color: #0b140b;
    box-shadow: 0 0 20px rgba(109, 255, 109, 0.8);
  }

  #blackOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    z-index: 99;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .countdown {
    font-size: 24px;
    color: #32ff32;
    margin-top: 20px;
    font-weight: bold;
    min-height: 30px;
  }
</style>
</head>
<body>

<div id="blackOverlay">
  <div class="permission-notice" id="permissionNotice">
    <h3>⚠️ ALIEN TRACKER INITIALIZATION ⚠️</h3>
    <p>This device requires compass access to activate the geo-locked radar system.</p>
    <p>Ensure you are in a secure location before proceeding.</p>
    <p style="color: #32ff32; font-weight: bold;">HTTPS connection established</p>
    <button class="enable-button" id="enableButton">ENABLE COMPASS TRACKING</button>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<canvas id="radar"></canvas>

<audio id="backgroundAudio" loop preload="auto">
  <source src="https://github.com/epicrezdomain-design/AlienTracker/raw/main/TrackerAmbient.mp3" type="audio/mp3">
  Your browser does not support the audio element.
</audio>

<script>

const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");
const blackOverlay = document.getElementById("blackOverlay");
const enableButton = document.getElementById("enableButton");
const countdownElement = document.getElementById("countdown");
const backgroundAudio = document.getElementById('backgroundAudio');

canvas.width = 1280;
canvas.height = 720;

// Click markers
const greenDots = [];

// Compass direction (where the dot appears from)
let compassDirection = 0; // 0° = North, 90° = East, etc.

// ===== GEO DOT APPROACH ANIMATION =====
// distance: 0 = at center, 1 = farthest edge
// Timeline: delay -> approach (0..1 accelerating) -> closest (1) -> recede (1..0 decelerating) -> fadeout
const APPROACH_DELAY_MS  = 10000;  // 10 seconds before first appearance
const APPROACH_RAMP_MS   = 6000;   // time from far -> closest
const RECEDE_RAMP_MS     = 4000;   // time from closest -> far
const FADE_MS            = 1500;   // fixed fadeout duration (always the same)

// Cycle: delay, approach, recede, fade, (then back to delay for next cycle)
const CYCLE_DELAY_MS = 4000; // pause between cycles (after fade ends)

let geoPhase = 'delay';       // 'delay' | 'approach' | 'recede' | 'fade'
let geoPhaseStart = 0;        // Date.now() when current phase began
let geoDistance = 1;          // current distance from center (0..1)
let geoOpacity = 0;           // 0..1 fade multiplier

function startGeoCycle(now) {
  geoPhase = 'delay';
  geoPhaseStart = now;
  geoDistance = 1;
  geoOpacity = 0;
}

// ===== BORDER HIGHLIGHT =====
let borderHighlights = {
  left: false,
  right: false,
  bottom: false,
  intensity: 0
};

let deviceOrientation = { available: false, alpha: 0, beta: 0, gamma: 0 };

// Click handler
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  greenDots.push({
    x: e.clientX - rect.left,
    y: e.clientY - rect.top,
    life: 100
  });
});

// Audio
function playBackgroundAudio() {
  backgroundAudio.volume = 0.4;
  const playPromise = backgroundAudio.play();
  if (playPromise !== undefined) {
    playPromise.catch(error => {
      const newAudio = new Audio(backgroundAudio.src);
      newAudio.volume = 0.4;
      newAudio.loop = true;
      newAudio.play().catch(e => console.log("Audio failed:", e));
    });
  }
}

// Countdown
function startCountdown(duration, callback) {
  let timeLeft = duration;
  countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
  const countdownInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (timeLeft <= 0) {
      clearInterval(countdownInterval);
      countdownElement.textContent = "SYSTEM ONLINE";
      setTimeout(callback, 300);
    } else {
      countdownElement.textContent = `SYSTEM BOOT IN: ${timeLeft.toFixed(1)}s`;
    }
  }, 100);
}

// Start
function startRadarSystem() {
  blackOverlay.style.display = 'none';
  startGeoCycle(Date.now());
  drawEverything();
}

// Orientation
function initDeviceOrientation() {
  backgroundAudio.volume = 0.4;

  if (window.DeviceOrientationEvent) {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              deviceOrientation.available = true;
              enableButton.disabled = true;
              enableButton.textContent = "INITIALIZING...";
              startCountdown(.8, startRadarSystem);
            }
          })
          .catch(console.error);
      });
    } else {
      enableButton.addEventListener('click', () => {
        playBackgroundAudio();
        window.addEventListener('deviceorientation', handleOrientation);
        deviceOrientation.available = true;
        enableButton.disabled = true;
        enableButton.textContent = "INITIALIZING...";
        startCountdown(.8, startRadarSystem);
      });
    }
  } else {
    enableButton.addEventListener('click', () => {
      playBackgroundAudio();
      setupMouseOrientation();
      enableButton.disabled = true;
      enableButton.textContent = "INITIALIZING...";
      startCountdown(.8, startRadarSystem);
    });
  }
}

function handleOrientation(event) {
  if (event.alpha !== null) {
    deviceOrientation.alpha = event.alpha;
    deviceOrientation.beta = event.beta;
    deviceOrientation.gamma = event.gamma;
    compassDirection = event.alpha;
    updateBorderHighlights();
  }
}

function setupMouseOrientation() {
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const centerX = canvas.width / 2;
    const centerY = canvas.height * 0.72;
    const dx = mx - centerX;
    const dy = my - centerY;

    let angle = Math.atan2(dy, dx) * (180 / Math.PI);
    angle = (angle + 90) % 360;
    if (angle < 0) angle += 360;

    compassDirection = angle;
    updateBorderHighlights();
  });
}

function updateBorderHighlights() {
  const dir = compassDirection;
  const radarStart = 315;
  const radarEnd = 45;
  const inRadar = (dir >= radarStart || dir <= radarEnd);

  borderHighlights.left = false;
  borderHighlights.right = false;
  borderHighlights.bottom = false;

  if (!inRadar) {
    if ((dir > 45 && dir <= 135) || (dir >= 225 && dir < 315)) {
      if (dir >= 225 && dir < 315) borderHighlights.left = true;
      else borderHighlights.right = true;
    } else {
      borderHighlights.bottom = true;
    }
    borderHighlights.intensity = Math.min(1, borderHighlights.intensity + 0.1);
  } else {
    borderHighlights.intensity = Math.max(0, borderHighlights.intensity - 0.05);
  }
}

// ===== GEO DOT POSITION + ANIMATION UPDATE =====
function updateGeoDot(now) {
  const elapsed = now - geoPhaseStart;

  if (geoPhase === 'delay') {
    if (elapsed >= APPROACH_DELAY_MS) {
      geoPhase = 'approach';
      geoPhaseStart = now;
    }
    geoDistance = 1;
    geoOpacity = 0;

  } else if (geoPhase === 'approach') {
    // t goes 0 -> 1 over APPROACH_RAMP_MS
    let t = Math.min(elapsed / APPROACH_RAMP_MS, 1);
    // Ease-in (accelerating) using t^2.5 — slow start, fast end
    const eased = Math.pow(t, 2.5);
    geoDistance = 1 - eased;   // 1 (far) -> 0 (close)
    geoOpacity = 0.15 + 0.85 * t; // brightens as it approaches

    if (t >= 1) {
      geoPhase = 'recede';
      geoPhaseStart = now;
      geoDistance = 0;
    }

  } else if (geoPhase === 'recede') {
    // t goes 0 -> 1 over RECEDE_RAMP_MS
    let t = Math.min(elapsed / RECEDE_RAMP_MS, 1);
    // Ease-out (decelerating) — fast start, slow end
    const eased = 1 - Math.pow(1 - t, 2.5);
    geoDistance = eased;       // 0 (close) -> 1 (far)
    geoOpacity = 1.0;

    if (t >= 1) {
      geoPhase = 'fade';
      geoPhaseStart = now;
      geoDistance = 1;
    }

  } else if (geoPhase === 'fade') {
    // Fixed fade duration regardless of anything
    let t = Math.min(elapsed / FADE_MS, 1);
    geoOpacity = 1 - t;
    geoDistance = 1;

    if (t >= 1) {
      // Cycle complete — wait a bit, then restart
      if (elapsed >= FADE_MS + CYCLE_DELAY_MS) {
        startGeoCycle(now);
      }
    }
  }
}

// Radar visibility (only show when in forward cone)
function isInRadarCone() {
  const dir = compassDirection;
  return (dir >= 315 || dir <= 45);
}

// ===== DRAW =====
function drawEverything() {
  drawRadarUI();
  requestAnimationFrame(drawEverything);
}

function drawRadarUI() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const now = Date.now();
  updateGeoDot(now);

  // ===== GAPPED CIRCLE =====
  const circleX = canvas.width / 2;
  const circleY = canvas.height * 0.71;
  const circleRadius = 110;
  const lineWidth = 45;

  const visibleSegments = [
    [232, 315],
    [45, 130],
    [137, 225],
  ];

  visibleSegments.forEach(([startDeg, endDeg], index) => {
    const startRad = ((startDeg - 90) * Math.PI / 180);
    const endRad = ((endDeg - 90) * Math.PI / 180);

    let isHighlighted = false;
    let highlightIntensity = 0;

    if (index === 0 && borderHighlights.left) {
      isHighlighted = true;
      highlightIntensity = borderHighlights.intensity;
    } else if (index === 1 && borderHighlights.right) {
      isHighlighted = true;
      highlightIntensity = borderHighlights.intensity;
    } else if (index === 2 && borderHighlights.bottom) {
      isHighlighted = true;
      highlightIntensity = borderHighlights.intensity;
    }

    if (isHighlighted && highlightIntensity > 0) {
      const baseR = 109, baseG = 255, baseB = 109;
      const targetR = 50, targetG = 255, targetB = 50;
      const r = Math.round(baseR + (targetR - baseR) * highlightIntensity);
      const g = Math.round(baseG + (targetG - baseG) * highlightIntensity);
      const b = Math.round(baseB + (targetB - baseB) * highlightIntensity);

      ctx.lineWidth = lineWidth + (10 * highlightIntensity);
      ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${0.3 + 0.7 * highlightIntensity})`;
      ctx.shadowBlur = 20 * highlightIntensity;
      ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${0.7 * highlightIntensity})`;
    } else {
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = "rgba(109, 255, 109, 0.3)";
      ctx.shadowBlur = 0;
    }

    ctx.lineCap = 'butt';

    if (endDeg < startDeg) {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, 0, endRad);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(circleX, circleY, circleRadius, startRad, endRad);
      ctx.stroke();
    }

    ctx.shadowBlur = 0;
  });

  // ===== RADAR ARCS =====
  const cx = canvas.width / 2;
  const apexY = canvas.height * 0.72;
  const radius = canvas.height * 0.62;
  const startAngle = -Math.PI * 0.73;
  const endAngle   = -Math.PI * 0.27;

  const green = "#6dff6d";

  function polar(r, a) {
    return { x: cx + r * Math.cos(a), y: apexY + r * Math.sin(a) };
  }

  ctx.strokeStyle = green;
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.arc(cx, apexY, radius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.strokeStyle = green;
  ctx.lineWidth = 1;
  const lowerRadius = radius - 10;
  ctx.beginPath();
  ctx.arc(cx, apexY, lowerRadius, startAngle + 0.015, endAngle - 0.015);
  ctx.stroke();

  ctx.lineWidth = 3;
  [startAngle, endAngle].forEach(a => {
    const p = polar(radius, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, apexY);
  ctx.lineTo(cx, apexY - radius * 1.03);
  ctx.stroke();

  [-0.48, +0.48].forEach(t => {
    const a = startAngle + (endAngle - startAngle) * (t + 1) / 2;
    const p = polar(radius * 1.03, a);
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  ctx.setLineDash([15, 30]);
  ctx.lineWidth = 1.5;
  [0.35, 0.55, 0.75].forEach(r => {
    ctx.beginPath();
    ctx.arc(cx, apexY, radius * r, startAngle + 0.03, endAngle - 0.03);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // ===== CLICK DOTS =====
  for (let i = greenDots.length - 1; i >= 0; i--) {
    const dot = greenDots[i];
    dot.life -= 1.5;

    if (dot.life > 0) {
      ctx.fillStyle = `rgba(109, 255, 109, ${dot.life/100})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(109, 255, 109, ${dot.life/200})`;
      ctx.beginPath();
      ctx.arc(dot.x, dot.y, 10, 0, Math.PI * 2);
      ctx.fill();
    } else {
      greenDots.splice(i, 1);
    }
  }

  // Left buttons
  ctx.fillStyle = "#32ff32";
  ctx.fillRect(cx - radius * 0.65, apexY + 20, 70, 40);
  ctx.fillRect(cx - radius * 0.65, apexY + 80, 48, 40);

  ctx.fillStyle = "#0b140b";
  ctx.font = "28px monospace";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("1", cx - radius * 0.63 + 50, apexY + 44);
  ctx.fillText("2", cx - radius * 0.63 + 24, apexY + 104);

  // Right labels
  ctx.fillStyle = green;
  ctx.font = "Bold 26px monospace";
  ctx.textAlign = "left";
  ["ATT", "SUS", "DEC"].forEach((t, i) => {
    ctx.fillText(t, cx + radius * 0.55, apexY + 35 + i * 36);
  });

  // ===== GEO DOT (animated approach/recede/fade) =====
  // Only render inside the forward radar cone, and only if there is opacity
  if (geoOpacity > 0.01 && isInRadarCone()) {

    // Map distance (0..1) to an actual radius from apex
    // distance = 1 -> full radar radius (far)
    // distance = 0 -> close to center (e.g., 15% of radius)
    const minR = radius * 0.15;
    const maxR = radius * 1.0;
    const r = minR + (maxR - minR) * geoDistance;

    const canvasAngle = (compassDirection - 90) * (Math.PI / 180);
    const dotX = cx + Math.cos(canvasAngle) * r;
    const dotY = apexY + Math.sin(canvasAngle) * r;

    // Dot grows as it approaches (closer = bigger)
    const sizeT = 1 - geoDistance;          // 0 far, 1 close
    const dotRadius = 3 + sizeT * 8;        // 3 -> 11
    const glowRadius = dotRadius * 2.2;

    // Alpha blending: base opacity from fade phase, modulated by distance (fainter when far)
    const distAlpha = 0.35 + 0.65 * sizeT;
    const finalAlpha = Math.max(0, Math.min(1, geoOpacity * distAlpha));

    if (finalAlpha > 0.01) {
      // Glow
      ctx.fillStyle = `rgba(50, 255, 50, ${0.25 * finalAlpha})`;
      ctx.beginPath();
      ctx.arc(dotX, dotY, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = `rgba(50, 255, 50, ${finalAlpha})`;
      ctx.beginPath();
      ctx.arc(dotX, dotY, dotRadius, 0, Math.PI * 2);
      ctx.fill();

      // Direction indicator line (only when reasonably visible)
      if (finalAlpha > 0.4) {
        const lineLength = dotRadius * 2.5;
        const endX = dotX + Math.cos(canvasAngle) * lineLength;
        const endY = dotY + Math.sin(canvasAngle) * lineLength;

        ctx.strokeStyle = `rgba(50, 255, 50, ${finalAlpha * 0.9})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(dotX, dotY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }
    }
  }
}

initDeviceOrientation();

</script>
</body>
</html>
